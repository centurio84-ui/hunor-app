name: MADtech release configuration checks
on:
  pull_request:
    branches: [main]
    paths: ['android/**','tool/release/**','.github/workflows/release-aab.yml','.github/workflows/madtech-release-checks.yml','pubspec.yaml']
permissions:
  contents: read
jobs:
  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 -m unittest discover -s tool/release -p 'test_*.py' -v
      - run: javac -d /tmp/release-verifier tool/release/VerifyReleaseAab.java
