name: Flutter CI/CD és Tesztelés

on:
  push:
    branches:
      - main
      - 'gemini/**'
      - 'infra/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-test:
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'codex/014-') && (github.head_ref || github.ref_name) != 'gemini/codex-016-authz-client' && (github.head_ref || github.ref_name) != 'gemini/codex-016-apk-download-fix' }}
    name: Flutter Statikus Elemzés, Tesztek és Mobil Építés
    runs-on: ubuntu-latest

    steps:
      - name: Forráskód letöltése (Checkout)
        uses: actions/checkout@v4

      - name: Java JDK 17 beállítása
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter SDK beállítása
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Környezet ellenőrzése
        run: |
          flutter --version
          dart --version
          java -version

      - name: Függőségek letöltése (flutter pub get)
        run: flutter pub get

      - name: Kódformázás ellenőrzése (dart format)
        run: |
          echo "### Kódformázási ellenőrzés (dart format)" >> $GITHUB_STEP_SUMMARY
          if dart format --output=none --set-exit-if-changed lib test; then
            echo "✅ Kódformázás megfelelő." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Formázási eltérések találhatók, automatikus javítás ajánlott." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Statikus kódelemzés (flutter analyze)
        run: flutter analyze --no-fatal-infos

      - name: Egység- és Widget-tesztek futtatása (flutter test)
        run: |
          echo "### Teszteredmények összefoglalója" >> $GITHUB_STEP_SUMMARY
          flutter test --reporter expanded
          echo "✅ Minden Flutter és Dart egységteszt sikeresen lefutott!" >> $GITHUB_STEP_SUMMARY

      - name: Android és Web platformfájlok biztosítása
        run: |
          flutter create --org hu.hunor --platforms android,web .

      - name: Android Debug APK építése (Valódi Staging API)
        run: |
          flutter build apk --debug \
            --dart-define=RESCUE_API_MODE=staging \
            --dart-define=RESCUE_API_BASE_URL=https://xbcutdkqswfzkubkozng.supabase.co/functions/v1/rescue-platform-staging/v1
          
          cd build/app/outputs/flutter-apk
          sha256sum app-debug.apk > SHA256SUMS.txt
          echo "### Android Staging Debug APK Építés" >> $GITHUB_STEP_SUMMARY
          echo "✅ Valódi HTTPS staging backenddel működő Android tesztverzió (APK) sikeresen lefordult." >> $GITHUB_STEP_SUMMARY
          echo "SHA-256: \`$(cat SHA256SUMS.txt)\`" >> $GITHUB_STEP_SUMMARY

      - name: Android APK artifact archiválása
        uses: actions/upload-artifact@v4
        with:
          name: rescue-platform-staging-android-debug
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          retention-days: 14

      - name: Flutter Web demó építés (Release Web Build)
        run: |
          flutter build web --release --base-href "/"
          echo "### Flutter Web Demó Építés" >> $GITHUB_STEP_SUMMARY
          echo "✅ Mobilra optimalizált Flutter Web tesztverzió sikeresen lefordult." >> $GITHUB_STEP_SUMMARY

      - name: Web demó artifact archiválása
        uses: actions/upload-artifact@v4
        with:
          name: rescue-platform-web-demo
          path: build/web
          retention-days: 14
