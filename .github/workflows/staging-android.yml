name: CODEX-014 Android staging
on:
  push:
    branches: [codex/014-flutter-staging-integration, gemini/codex-016-authz-client]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: staging-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Generate isolated Android shell
        run: |
          flutter create --org hu.rescue.staging --platforms android --project-name hunor_app .
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text().replace('<application','<uses-permission android:name="android.permission.INTERNET" />\n    <application android:allowBackup="false" android:usesCleartextTraffic="false"',1)
          p.write_text(s)
          p=Path('android/app/build.gradle.kts')
          p.write_text(p.read_text().replace('minSdk = flutter.minSdkVersion','minSdk = 23'))
          PY
      - run: flutter pub get
      - run: dart format lib/api/staging_api.dart
      - run: flutter analyze --no-fatal-infos | tee flutter-analyze.txt
      - run: flutter test --reporter expanded | tee flutter-tests.txt
      - name: Build staging Debug APK (no credentials)
        run: flutter build apk --debug --dart-define=RESCUE_API_MODE=staging --dart-define=RESCUE_API_BASE_URL=https://xbcutdkqswfzkubkozng.supabase.co/functions/v1/rescue-platform-staging/v1
      - name: APK checksum
        run: sha256sum build/app/outputs/flutter-apk/app-debug.apk > build/app/outputs/flutter-apk/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rescue-platform-staging-android-debug
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-build-evidence
          path: |
            pubspec.lock
            flutter-analyze.txt
            flutter-tests.txt
            android/app/src/main/AndroidManifest.xml
          retention-days: 14
