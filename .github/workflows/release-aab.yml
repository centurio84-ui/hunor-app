name: Google Play Release AAB Build

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Célkörnyezet (supabase, staging vagy production)'
        required: true
        default: 'supabase'
        type: choice
        options:
          - supabase
          - staging
          - production
      build_number:
        description: 'Android versionCode (pl. 10002)'
        required: false
        default: '10002'
      version_name:
        description: 'Android versionName (pl. 1.0.1)'
        required: false
        default: '1.0.1'
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build-aab:
    name: Build Signed Android App Bundle (.aab)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Flutter environment
        run: |
          flutter --version
          dart --version

      - name: Generate clean Android shell
        run: flutter create --org hu.hunor --project-name hunor_app --platforms android .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run unit & widget tests
        run: flutter test --reporter expanded

      - name: Configure Android Build & Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 .github/scripts/configure_android_build.py

      - name: Build Android App Bundle (Release AAB)
        shell: bash
        run: |
          TARGET_ENV="${{ github.event.inputs.target_env }}"
          if [ -z "$TARGET_ENV" ]; then TARGET_ENV="supabase"; fi
          BUILD_NUM="${{ github.event.inputs.build_number }}"
          if [ -z "$BUILD_NUM" ]; then BUILD_NUM="10002"; fi
          VERSION_NAME="${{ github.event.inputs.version_name }}"
          if [ -z "$VERSION_NAME" ]; then VERSION_NAME="1.0.1"; fi
          
          echo "Build célkörnyezet: $TARGET_ENV"
          echo "Verzió: $VERSION_NAME ($BUILD_NUM)"

          if [ "$TARGET_ENV" = "supabase" ]; then
            API_MODE="supabase"
            echo "Alkalmazott API_MODE: $API_MODE (Éles HUNOR Supabase kapcsolat)"
            flutter build appbundle --release --build-number=$BUILD_NUM --build-name=$VERSION_NAME \
              --dart-define=RESCUE_API_MODE=supabase \
              --dart-define=SUPABASE_URL=https://embicteneumubwlqqfik.supabase.co \
              --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_Vt7KtNGznwvPrDRr5VEn0Q_r-Z6sas1
          elif [ "$TARGET_ENV" = "production" ]; then
            PROD_URL="${{ secrets.RESCUE_PROD_API_BASE_URL }}"
            if [ -z "$PROD_URL" ]; then
              echo "::error::HIÁNYZÓ PRODUCTION API CÍM: Production kiadáshoz kötelező a jóváhagyott RESCUE_PROD_API_BASE_URL secret!"
              echo "A build biztonsági okokból leáll; éles kiadás nem készülhet el staging vagy hiányzó címmel."
              exit 1
            fi
            API_URL="$PROD_URL"
            API_MODE="production"
            flutter build appbundle --release --build-number=$BUILD_NUM --build-name=$VERSION_NAME \
              --dart-define=RESCUE_API_MODE=$API_MODE \
              --dart-define=RESCUE_API_BASE_URL=$API_URL
          else
            STAGING_URL="${{ secrets.RESCUE_STAGING_API_BASE_URL }}"
            if [ -z "$STAGING_URL" ]; then
              STAGING_URL="https://xbcutdkqswfzkubkozng.supabase.co/functions/v1/rescue-platform-staging/v1"
            fi
            API_URL="$STAGING_URL"
            API_MODE="staging"
            flutter build appbundle --release --build-number=$BUILD_NUM --build-name=$VERSION_NAME \
              --dart-define=RESCUE_API_MODE=$API_MODE \
              --dart-define=RESCUE_API_BASE_URL=$API_URL
          fi
          ls -la build/app/outputs/bundle/release/

      - name: Verify Signed AAB Integrity and Signatures
        shell: bash
        run: |
          AAB_FILE="build/app/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB_FILE" ]; then
            echo "::error::A release AAB fájl nem található: $AAB_FILE"
            exit 1
          fi
          
          echo "=== AAB fájlméret és integritás vizsgálata ==="
          ls -lh "$AAB_FILE"
          unzip -t "$AAB_FILE" > /dev/null
          echo "AAB zip integritás: OK"

          echo "=== Aláírás vizsgálata jarsigner segítségével ==="
          jarsigner -verify -verbose -certs "$AAB_FILE" | grep -E "jar verified|Signed by|CN=" || true
          
          # Ellenőrizzük, hogy a MANIFEST.MF és aláírófájlok (.RSA/.SF) jelen vannak-e
          unzip -l "$AAB_FILE" | grep "META-INF/" | head -n 10

      - name: Generate AAB Checksum
        run: |
          cd build/app/outputs/bundle/release/
          sha256sum app-release.aab > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Archive Android App Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rescue-platform-release-aab
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/bundle/release/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
