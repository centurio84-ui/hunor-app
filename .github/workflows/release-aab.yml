name: Google Play Release AAB Build

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Célkörnyezet (most kizárólag staging engedélyezett)'
        required: true
        default: staging
        type: choice
        options: [staging, production]
      build_number:
        description: 'Android versionCode'
        required: true
        default: '10001'
      version_name:
        description: 'Android versionName'
        required: true
        default: '1.0.0'
  push:
    branches: [gemini/rescue-release-002]
    paths: [.github/workflows/release-aab.yml]
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build-aab:
    name: Build and verify MADtech signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter SDK (successful reference version)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Validate release configuration and tooling tests
        env:
          INPUT_TARGET_ENV: ${{ inputs.target_env }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          STAGING_API_URL: ${{ secrets.RESCUE_STAGING_API_BASE_URL }}
          PRODUCTION_API_URL: ${{ secrets.RESCUE_PROD_API_BASE_URL }}
        run: |
          python3 -m unittest discover -s tool/release -p 'test_*.py' -v
          python3 tool/release/resolve_build.py
      - name: Generate Android shell and verify committed identity
        run: |
          cp pubspec.lock "$RUNNER_TEMP/madtech-source-pubspec.lock"
          flutter create --no-pub --org hu.madtech --project-name hunor_app --platforms android .
          cp "$RUNNER_TEMP/madtech-source-pubspec.lock" pubspec.lock
          python3 tool/release/check_android_branding.py
      - name: Install dependencies
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
      - name: Analyze code
        run: flutter analyze --no-fatal-infos
      - name: Run unit and widget tests
        run: flutter test --reporter expanded
      - name: Download and checksum official Gradle distribution
        run: |
          curl --fail --location --retry 3 --retry-all-errors --proto '=https' --tlsv1.2 \
            https://downloads.gradle.org/distributions/gradle-9.3.1-bin.zip -o "$RUNNER_TEMP/gradle-9.3.1-bin.zip"
          python3 tool/release/use_verified_gradle.py "$RUNNER_TEMP/gradle-9.3.1-bin.zip"
      - name: Cache checksum-verified official Kotlin compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.2.21 --repo JetBrains/kotlin --pattern kotlin-compiler-embeddable-2.2.21.jar --dir "$RUNNER_TEMP"
          python3 tool/release/cache_verified_kotlin.py "$RUNNER_TEMP/kotlin-compiler-embeddable-2.2.21.jar"
      - name: Configure existing release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tool/release/configure_signing.py
      - name: Build signed Android App Bundle
        run: |
          flutter build appbundle --release --build-number="$BUILD_NUMBER" --build-name="$VERSION_NAME" \
            --dart-define="RESCUE_API_MODE=$TARGET_ENV" \
            --dart-define="RESCUE_API_BASE_URL=$BUILD_API_URL"
      - name: Verify ZIP and JAR cryptographic signature
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          OUT=build/app/outputs/bundle/release
          unzip -t "$AAB" > /dev/null
          jarsigner -J-Duser.language=en -verify -verbose -certs "$AAB" > "$OUT/jarsigner-verification.txt" 2>&1
          grep -q 'jar verified' "$OUT/jarsigner-verification.txt"
          java tool/release/VerifyReleaseAab.java "$AAB" android/app/release.keystore "$ANDROID_KEY_ALIAS" "$OUT/SIGNATURE-VERIFICATION.json"
      - name: Verify actual AAB package and version with pinned Google bundletool
        run: |
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o /tmp/bundletool.jar
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  /tmp/bundletool.jar' | sha256sum --check -
          AAB=build/app/outputs/bundle/release/app-release.aab
          java -jar /tmp/bundletool.jar validate --bundle="$AAB"
          java -jar /tmp/bundletool.jar dump manifest --bundle="$AAB" --module=base > build/app/outputs/bundle/release/AndroidManifest.verified.xml
          python3 tool/release/verify_bundle_manifest.py
      - name: Generate SHA-256
        working-directory: build/app/outputs/bundle/release
        run: sha256sum app-release.aab > SHA256SUMS.txt
      - name: Upload verified AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: madtech-rescue-platform-${{ env.TARGET_ENV }}-aab
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/bundle/release/SHA256SUMS.txt
            build/app/outputs/bundle/release/BUILDINFO.json
            build/app/outputs/bundle/release/SIGNATURE-VERIFICATION.json
            build/app/outputs/bundle/release/jarsigner-verification.txt
            build/app/outputs/bundle/release/AndroidManifest.verified.xml
          retention-days: 30
          if-no-files-found: error
      - name: Remove ephemeral signing files
        if: always()
        run: rm -f android/app/release.keystore android/key.properties
