name: Google Play Release AAB Build

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Célkörnyezet (staging vagy production)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      build_number:
        description: 'Android versionCode (pl. 10001)'
        required: false
        default: '10001'
      version_name:
        description: 'Android versionName (pl. 1.0.0)'
        required: false
        default: '1.0.0'
  push:
    branches:
      - gemini/rescue-release-002
    paths:
      - .github/workflows/release-aab.yml
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build-aab:
    name: Build Signed Android App Bundle (.aab)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Flutter environment
        run: |
          flutter --version
          dart --version

      - name: Generate clean Android shell
        run: |
          flutter create --org hu.hunor --project-name hunor_app --platforms android .
          python3 - <<'PY'
          from pathlib import Path
          
          # AndroidManifest konfiguráció (biztonságos internet és mentési beállítások)
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          if manifest.exists():
              text = manifest.read_text()
              if 'android.permission.INTERNET' not in text:
                  text = text.replace('<application', '<uses-permission android:name="android.permission.INTERNET" />\n    <application android:allowBackup="false" android:usesCleartextTraffic="false"', 1)
                  manifest.write_text(text)

          # Target SDK és Min SDK frissítés (Google Play 2026. augusztus követelmény: targetSdk 36, minSdk 23)
          gradle_kts = Path('android/app/build.gradle.kts')
          if gradle_kts.exists():
              gt = gradle_kts.read_text()
              gt = gt.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
              gt = gt.replace('targetSdk = flutter.targetSdkVersion', 'targetSdk = 36')
              gradle_kts.write_text(gt)
          
          gradle_groovy = Path('android/app/build.gradle')
          if gradle_groovy.exists():
              gt = gradle_groovy.read_text()
              gt = gt.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 23')
              gt = gt.replace('targetSdkVersion flutter.targetSdkVersion', 'targetSdkVersion 36')
              gradle_groovy.write_text(gt)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run unit & widget tests
        run: flutter test --reporter expanded

      - name: Configure Signing Keystore
        id: signing
        shell: bash
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] || [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] || [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ] || [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            echo "::error::HIÁNYZÓ KIADÁSI TITKOK: Az ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS vagy ANDROID_KEY_PASSWORD secret nincs beállítva!"
            echo "A Google Play Production AAB fordítás nem folytatható hiteles aláírás nélkül."
            exit 1
          fi

          echo "Kiadási aláírókulcs elérhető (GitHub Secret). Aláírt kiadási AAB készül."
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release.keystore
          EOF

          # Gradle signingConfigs tényleges bekötése a build.gradle / build.gradle.kts fájlban
          # Biztonságos felülírás: nem bántjuk a debug signingConfig-ot, kizárólag a release signingConfig-ot hozzuk létre és kötjük a release buildType-hoz.
          python3 - <<'PY'
          from pathlib import Path

          p_kts = Path('android/app/build.gradle.kts')
          if p_kts.exists():
              s = p_kts.read_text()
              if 'import java.util.Properties' not in s:
                  s = 'import java.util.Properties\nimport java.io.FileInputStream\n' + s
              if 'signingConfigs.create("release")' not in s and 'create("release")' not in s:
                  marker = 'buildTypes {'
                  signing_code = '''
              signingConfigs {
                  create("release") {
                      val keyProps = Properties()
                      val keyPropsFile = rootProject.file("key.properties")
                      if (keyPropsFile.exists()) {
                          keyProps.load(FileInputStream(keyPropsFile))
                          storeFile = file(keyProps.getProperty("storeFile"))
                          storePassword = keyProps.getProperty("storePassword")
                          keyAlias = keyProps.getProperty("keyAlias")
                          keyPassword = keyProps.getProperty("keyPassword")
                      }
                  }
              }
          '''
                  if marker in s:
                      s = s.replace(marker, signing_code + '\n    ' + marker)
                      # Csak a getByName("release") signingConfigját irányítjuk át, a debug érintetlen marad
                      if 'signingConfig = signingConfigs.getByName("release")' not in s:
                          s = s.replace('getByName("release") {', 'getByName("release") {\n            signingConfig = signingConfigs.getByName("release")')
                      p_kts.write_text(s)

          p_groovy = Path('android/app/build.gradle')
          if p_groovy.exists():
              s = p_groovy.read_text()
              if 'release {' not in s or 'signingConfigs {' not in s:
                  marker = 'buildTypes {'
                  signing_code = '''
              signingConfigs {
                  release {
                      def keyProps = new Properties()
                      def keyPropsFile = rootProject.file("key.properties")
                      if (keyPropsFile.exists()) {
                          keyProps.load(new FileInputStream(keyPropsFile))
                          storeFile file(keyProps['storeFile'])
                          storePassword keyProps['storePassword']
                          keyAlias keyProps['keyAlias']
                          keyPassword keyProps['keyPassword']
                      }
                  }
              }
          '''
                  if marker in s:
                      s = s.replace(marker, signing_code + '\n    ' + marker)
                      if 'signingConfig signingConfigs.release' not in s:
                          s = s.replace('release {', 'release {\n            signingConfig signingConfigs.release')
                      p_groovy.write_text(s)
          PY

      - name: Build Android App Bundle (Release AAB)
        shell: bash
        run: |
          TARGET_ENV="${{ github.event.inputs.target_env || 'staging' }}"
          BUILD_NUM="${{ github.event.inputs.build_number || '10001' }}"
          VERSION_NAME="${{ github.event.inputs.version_name || '1.0.0' }}"
          
          echo "Build célkörnyezet: $TARGET_ENV"
          echo "Verzió: $VERSION_NAME ($BUILD_NUM)"

          if [ "$TARGET_ENV" = "production" ]; then
            PROD_URL="${{ secrets.RESCUE_PROD_API_BASE_URL }}"
            if [ -z "$PROD_URL" ]; then
              echo "::error::HIÁNYZÓ PRODUCTION API CÍM: Production kiadáshoz kötelező a jóváhagyott RESCUE_PROD_API_BASE_URL secret!"
              echo "A build biztonsági okokból leáll; éles kiadás nem készülhet el staging vagy hiányzó címmel."
              exit 1
            fi
            # A production build csak jóváhagyott éles címmel futhat le
            API_URL="$PROD_URL"
            API_MODE="production"
          else
            # Staging tesztkiadás: kizárólag a hivatalos, jóváhagyott staging végpont használható
            STAGING_URL="${{ secrets.RESCUE_STAGING_API_BASE_URL || 'https://xbcutdkqswfzkubkozng.supabase.co/functions/v1/rescue-platform-staging/v1' }}"
            API_URL="$STAGING_URL"
            API_MODE="staging"
          fi

          echo "Alkalmazott API_MODE: $API_MODE"
          flutter build appbundle --release --build-number=$BUILD_NUM --build-name=$VERSION_NAME \
            --dart-define=RESCUE_API_MODE=$API_MODE \
            --dart-define=RESCUE_API_BASE_URL=$API_URL
          ls -la build/app/outputs/bundle/release/

      - name: Verify Signed AAB Integrity and Signatures
        shell: bash
        run: |
          AAB_FILE="build/app/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB_FILE" ]; then
            echo "::error::A release AAB fájl nem található: $AAB_FILE"
            exit 1
          fi
          
          echo "=== AAB fájlméret és integritás vizsgálata ==="
          ls -lh "$AAB_FILE"
          unzip -t "$AAB_FILE" > /dev/null
          echo "AAB zip integritás: OK"

          echo "=== Aláírás vizsgálata jarsigner segítségével ==="
          # jarsigner -strict returns exit 4 for certificate warnings (e.g. self-signed upload key).
          # Non-strict verification still fails on invalid/unsigned JAR signatures.
          jarsigner -verify -verbose -certs "$AAB_FILE" > /tmp/aab-signature-verification.log 2>&1 || {
            cat /tmp/aab-signature-verification.log
            echo "::error::AAB signature verification failed"
            exit 1
          }
          if ! grep -q "jar verified" /tmp/aab-signature-verification.log; then
            cat /tmp/aab-signature-verification.log
            echo "::error::AAB is not cryptographically verified"
            exit 1
          fi
          grep -E "jar verified|Signed by|CN=|Warning:" /tmp/aab-signature-verification.log || true
          
          # Ellenőrizzük, hogy a MANIFEST.MF és aláírófájlok (.RSA/.SF) jelen vannak-e
          unzip -l "$AAB_FILE" | grep "META-INF/" | head -n 10

      - name: Generate AAB Checksum
        run: |
          cd build/app/outputs/bundle/release/
          sha256sum app-release.aab > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Archive Android App Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rescue-platform-release-aab
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/bundle/release/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
