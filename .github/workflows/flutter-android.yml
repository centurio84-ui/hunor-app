name: Flutter Android build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'codex/014-') && (github.head_ref || github.ref_name) != 'gemini/codex-016-authz-client' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: flutter create --platforms=android .

      - name: Get packages
        run: flutter pub get

      - name: Configure Android Build & Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 .github/scripts/configure_android_build.py

      - name: Build Android Release APK
        run: |
          flutter build apk --release \
            --build-number=10005 \
            --build-name=1.0.4 \
            --dart-define=RESCUE_API_MODE=supabase \
            --dart-define=SUPABASE_URL=https://embicteneumubwlqqfik.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_Vt7KtNGznwvPrDRr5VEn0Q_r-Z6sas1

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: hunor-android-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Build Android App Bundle (.aab)
        run: |
          flutter build appbundle --release \
            --build-number=10005 \
            --build-name=1.0.4 \
            --dart-define=RESCUE_API_MODE=supabase \
            --dart-define=SUPABASE_URL=https://embicteneumubwlqqfik.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_Vt7KtNGznwvPrDRr5VEn0Q_r-Z6sas1

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: hunor-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
