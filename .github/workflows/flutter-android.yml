name: Flutter Android build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'codex/014-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate platform folders
        run: flutter create --platforms=android .

      - name: Configure Google Services plugin
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          if p.exists():
              s = p.read_text()
              if "com.google.gms.google-services" not in s:
                  s = s.replace(
                      "plugins {",
                      "plugins {\n    id 'com.google.gms.google-services'",
                      1,
                  )
                  p.write_text(s)

          p = Path("android/settings.gradle")
          if p.exists():
              s = p.read_text()
              if "com.google.gms.google-services" not in s:
                  marker = "plugins {"
                  idx = s.find(marker)
                  if idx >= 0:
                      end = s.find("\n}", idx)
                      if end >= 0:
                          s = s[:end] + "\n    id 'com.google.gms.google-services' version '4.4.4' apply false" + s[end:]
                          p.write_text(s)
          PY

      - name: Get packages
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --debug --dart-define=SUPABASE_URL=https://embicteneumubwlqgfik.supabase.co --dart-define=SUPABASE_PUBLISHABLE_KEY=placeholder

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: hunor-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
