publish_to: "none"
version: 1.0.10+10012

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.0.0
  provider: ^6.1.5
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
