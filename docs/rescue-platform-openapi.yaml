components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth hozzáférési JWT ellenőrzött issuer/audience/signature/exp/session alapján; friss
        adatbázisos tagság és jogellenőrzés egészíti ki.
  parameters:
    OrganizationId:
      name: organization_id
      in: path
      required: true
      description: Szervezeti UUID. Kliens által választott hatókör; a szerver friss tagsággal ellenőrzi.
      schema: *id004
    MembershipId:
      name: membership_id
      in: path
      required: true
      description: Szervezeti tagság UUID-ja, nem az Auth felhasználó azonosítója.
      schema: *id004
    EventId:
      name: event_id
      in: path
      required: true
      schema: *id004
    AlertId:
      name: alert_id
      in: path
      required: true
      schema: *id004
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      description: Átlátszatlan, szervezethez és szűrőkhöz kötött, aláírt kurzor.
      schema:
        type: string
        maxLength: 4096
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Kliensenként generált UUID. Az eredeti eredmény 24 óráig újrajátszható; eltérő törzzsel 409.
        Hatókör: actor + organization + operation.'
      schema: *id004
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 'A GET válasz erős ETag-je. Eltérő verzió: 412; hiányzó fejléc: 428. Nem fogad el * értéket.'
      schema:
        type: string
        pattern: ^"v[0-9]+"$
        example: '"v3"'
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        request_id: *id004
        details:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              field:
                type: string
              reason:
                type: string
            required:
            - field
            - reason
      required:
      - code
      - message
      - request_id
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 256
      required:
      - email
      - password
    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 8192
      required:
      - refresh_token
    Session:
      type: object
      additionalProperties: false
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum:
          - Bearer
        expires_at: *id003
        user:
          $ref: '#/components/schemas/User'
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_at
      - user
    User:
      type: object
      additionalProperties: false
      properties:
        id: *id004
        email:
          type: string
          format: email
        display_name:
          type: string
          minLength: 1
          maxLength: 160
        avatar_url:
          type: string
          format: uri
          nullable: true
      required:
      - id
      - email
      - display_name
    ProfilePatch:
      type: object
      additionalProperties: false
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 160
        contact_phone:
          type: string
          maxLength: 40
          nullable: true
      minProperties: 1
    Profile:
      type: object
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/User'
        contact_phone:
          type: string
          nullable: true
        version: &id005
          type: integer
          minimum: 0
          maximum: 2147483647
      required:
      - user
      - version
    Organization:
      type: object
      additionalProperties: false
      properties:
        id: *id004
        name:
          type: string
          minLength: 1
          maxLength: 160
        slug:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{1,62}$
        timezone:
          type: string
          example: Europe/Budapest
        status:
          type: string
          enum:
          - active
          - suspended
        my_membership_id: *id004
      required:
      - id
      - name
      - slug
      - timezone
      - status
      - my_membership_id
    OrganizationMember:
      type: object
      additionalProperties: false
      properties:
        id: *id004
        organization_id: *id004
        user_id: *id004
        display_name:
          type: string
          minLength: 1
          maxLength: 160
        membership_status:
          type: string
          enum:
          - pending
          - approved
          - suspended
          - left
        positions:
          type: array
          items:
            type: string
        skills:
          type: array
          items:
            type: string
        county:
          type: string
          nullable: true
          maxLength: 160
        workplace:
          type: string
          nullable: true
          maxLength: 240
        alertable:
          type: boolean
        permissions:
          type: array
          items:
            type: string
        version: *id005
      required:
      - id
      - organization_id
      - user_id
      - display_name
      - membership_status
      - positions
      - skills
      - alertable
      - permissions
      - version
    EventCreate:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 240
        description:
          type: string
          maxLength: 12000
        location:
          type: string
          maxLength: 500
        kind:
          type: string
          enum:
          - training
          - exercise
          - deployment
          - demonstration
          - meeting
          - other
        starts_at: *id003
        ends_at: *id003
        visibility:
          type: string
          enum:
          - members
          - public
      required:
      - title
      - kind
      - starts_at
      - ends_at
      - visibility
    EventPatch:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 240
        description:
          type: string
          maxLength: 12000
        location:
          type: string
          maxLength: 500
        starts_at: *id003
        ends_at: *id003
        visibility:
          type: string
          enum:
          - members
          - public
      minProperties: 1
    Event:
      type: object
      additionalProperties: false
      properties:
        id: *id004
        organization_id: *id004
        title:
          type: string
          minLength: 1
          maxLength: 240
        description:
          type: string
        location:
          type: string
        kind:
          type: string
          enum:
          - training
          - exercise
          - deployment
          - demonstration
          - meeting
          - other
        starts_at: *id003
        ends_at: *id003
        visibility:
          type: string
          enum:
          - members
          - public
        status:
          type: string
          enum:
          - draft
          - open
          - closed
          - cancelled
        created_by_membership_id: *id004
        version: *id005
      required:
      - id
      - organization_id
      - title
      - kind
      - starts_at
      - ends_at
      - visibility
      - status
      - version
    ParticipationRequest:
      type: object
      additionalProperties: false
      properties:
        response:
          type: string
          enum:
          - going
          - not_going
        role:
          type: string
          enum:
          - participant
          - excon
      required:
      - response
      - role
