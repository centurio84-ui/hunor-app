openapi: 3.0.3
info:
  title: Rescue Platform – közös API szerződéstervezet
  version: 0.1.0-draft
  description: CODEX-001 / 2026-10-14. Kizárólag terv a projektvezető és a Gemini fejlesztő számára. E végpontok
    NEM kerültek bevezetésre. A szervezeti hatókör minden útvonalon szerveroldalon igazolandó; a jelenlegi HUNOR
    RPC-k nem azonosak e szerződéssel.
servers:
- url: https://api.rescue-platform.invalid/v1
  description: Szándékosan nem működő példacím; nincs éles API.
x-implementation-status: proposal-only
security:
- bearerAuth: []
tags:
- name: Auth
- name: Profiles
- name: Organizations
- name: Events
- name: Participation
- name: Alerts
- name: RescueCoins
paths:
  /auth/sessions:
    post:
      operationId: createSession
      summary: Bejelentkezés e-maillel és jelszóval
      description: Tervezett Supabase Auth adapter. Nem saját jelszó-adatbázis. TLS; általános hibaüzenet, nincs
        fiókfelderítés. Mobilon a refresh token védett OS tárba kerül; böngészős HttpOnly BFF külön döntés. Jelszó,
        token nem naplózható. MFA/passkey challenge nincs ebben az első szerződésben; ilyen fióknál a jövőbeli challenge
        folyamatig nem adható ki teljes session.
      tags:
      - Auth
      x-status: proposal-not-implemented
      x-required-permissions: []
      parameters: []
      responses:
        '200':
          description: Sikeres válasz
          headers:
            X-Request-Id: &id001
              description: Szerver által generált korrelációs UUID, nem titok.
              schema: &id004
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      security: []
  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Munkamenet megújítása
      description: A refresh token hitelesít; forgatás és újrafelhasználás-védelem az Auth szolgáltatónál. A kliens
        atomi módon lecseréli a tokent; párhuzamos refresh kerülendő.
      tags:
      - Auth
      x-status: proposal-not-implemented
      x-required-permissions: []
      parameters: []
      responses:
        '200':
          description: Sikeres válasz
          headers:
            X-Request-Id: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      security: []
  /auth/sessions/current:
    delete:
      operationId: revokeCurrentSession
      summary: Aktuális munkamenet visszavonása
      description: A szerver visszavonja a jelenlegi sessiont. Magas kockázatú végpontok session_id alapú visszavonás-ellenőrzést
        igényelnek; a JWT önmagában lejáratig élhet. Eszközkötés letiltását a későbbi eszköz API végzi.
      tags:
      - Auth
      x-status: proposal-not-implemented
      x-required-permissions: []
      parameters: []
      responses:
        '204':
          description: Sikeres művelet, üres törzs.
          headers:
            X-Request-Id: *id001
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /me:
    get:
      operationId: getMyProfile
      summary: Saját alapadatok
      description: Globális Auth-identitás és minimális profil; szervezeti beosztás az organization tagsági nézetében.
        Egészségügyi és okmányadatot nem ad vissza.
      tags:
      - Profiles
      x-status: proposal-not-implemented
      x-required-permissions: []
      parameters: []
      responses:
        '200':
          description: Sikeres válasz
          headers:
            X-Request-Id: *id001
            ETag: &id002
              description: Az adott erőforrás aktuális verziója, a következő If-Match-hez.
              schema:
                type: string
                example: '"v3"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
    patch:
      operationId: updateMyProfile
      summary: Saját alapadatok módosítása
      description: Csak display_name és contact_phone. Szerepkör, tagsági állapot, beosztási jogosultság és Auth
        e-mail nem írható tömeges mezőátadással.
      tags:
      - Profiles
      x-status: proposal-not-implemented
      x-required-permissions: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Sikeres válasz
          headers:
            X-Request-Id: *id001
            ETag: *id002
            Idempotency-Replayed:
              schema:
                type: boolean
              description: Igaz, ha egy korábbi eredményt játszottunk újra.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '412':
          $ref: '#/components/responses/Error412'
        '428':
          $ref: '#/components/responses/Error428'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatch'
  /organizations:
    get:
      operationId: listMyOrganizations
      summary: Saját szervezetek listája
      description: Kizárólag a bejelentkezett felhasználó tagságai. Nem nyilvános szervezetjegyzék.
      tags:
      - Organizations
      x-status: proposal-not-implemented
      x-required-permissions: []
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Sikeres válasz
          headers:
            X-Request-Id: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationsPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /organizations/{organization_id}:
    get:
      operationId: getOrganization
      summary: Szervezet részletei
      description: ''
      tags:
      - Organizations
      x-status: proposal-not-implemented
      x-required-permissions:
      - organization.read
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Sikeres válasz
          headers:
            X-Request-Id: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /organizations/{organization_id}/members/me:
    get:
      operationId: getMyOrganizationMembership
      summary: Saját szervezeti profil és effektív jogok
      description: A permissions a szerver által számított UI-tájékoztatás. Minden kérés külön, friss szerveroldali
        ellenőrzést kap; a kliens nem küldhet hiteles joglistát.
      tags:
      - Profiles
      x-status: proposal-not-implemented
      x-required-permissions:
      - membership.read_self
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Sikeres válasz
          headers:
            X-Request-Id: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMember'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /organizations/{organization_id}/members:
    get:
      operationId: listOrganizationMembers
      summary: Szervezeti tagjegyzék
      description: Csak jóváhagyott tagok megengedett jegyzéki adatai; okmány, egészségügy, privát elérhetőség és
        készüléktoken nélkül.
      tags:
      - Organizations
      x-status: proposal-not-implemented
      x-required-permissions:
      - members.read
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - name: search
        in: query
        schema:
          type: string
          maxLength: 160
      responses:
        '200':
          description: Sikeres válasz
          headers:
            X-Request-Id: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembersPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /organizations/{organization_id}/events:
    get:
      operationId: listEvents
      summary: Eseménylista
      description: A visibility nem kerüli meg a tagságellenőrzést ezen a belső API-n. Nyilvános vendég API külön
        szerződés. UTC intervallum [from,to), starts_at alapján; stabil rendezés starts_at,id.
      tags:
      - Events
      x-status: proposal-not-implemented
      x-required-permissions:
      - events.read
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - name: from
        in: query
        schema: &id003
          type: string
          format: date-time
      - name: to
        in: query
        schema: *id003
      responses:
        '200':
          description: Sikeres válasz
          headers:
            X-Request-Id: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
    post:
      operationId: createEvent
      summary: Esemény létrehozása
      description: ends_at > starts_at. Létrehozó szerveroldalon az aktuális tagság. Esemény létrehozása önmagában
        nem küld riasztást.
      tags:
      - Events
      x-status: proposal-not-implemented
      x-required-permissions:
      - events.manage
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Sikeres válasz
          headers:
            X-Request-Id: *id001
            Idempotency-Replayed:
              schema:
                type: boolean
              description: Igaz, ha egy korábbi eredményt játszottunk újra.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreate'
  /organizations/{organization_id}/events/{event_id}:
    get:
      operationId: getEvent
      summary: Esemény részletei
      description: ''
      tags:
      - Events
      x-status: proposal-not-implemented
      x-required-permissions:
      - events.read
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Sikeres válasz
          headers:
            X-Request-Id: *id001
            ETag: *id002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
    patch:
      operationId: updateEvent
      summary: Esemény módosítása
      description: A teljes eredő időszakot ellenőrzi. Lezárt esemény és aktív riasztással kapcsolatos időpontváltoztatás
        409; későbbi külön admin folyamat szükséges.
      tags:
      - Events
      x-status: proposal-not-implemented
      x-required-permissions:
      - events.manage
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Sikeres válasz
          headers:
            X-Request-Id: *id001
            ETag: *id002
            Idempotency-Replayed:
              schema:
                type: boolean
              description: Igaz, ha egy korábbi eredményt játszottunk újra.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '412':
          $ref: '#/components/responses/Error412'
        '428':
          $ref: '#/components/responses/Error428'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventPatch'
  /organizations/{organization_id}/events/{event_id}/participation/me:
    get:
      operationId: getMyEventParticipation
      summary: Saját eseményjelentkezés
      description: Ha még nincs jelentkezés, pending és version=0 reprezentáció; ebből indul az If-Match.
      tags:
      - Participation
      x-status: proposal-not-implemented
      x-required-permissions:
      - events.read
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Sikeres válasz
          headers:
            X-Request-Id: *id001
            ETag: *id002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Participation'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
    put:
      operationId: setMyEventParticipation
      summary: Résztvételi válasz eseményre
      description: 'Csak saját tagság. exercise esetén participant vagy excon; excon szerveroldali excon jogosultságot
        igényel. Egyéb eseménynél kizárólag participant. going = Részt tudok venni, not_going = Nem tudok részt
        venni. Lezárt esemény: 409.'
      tags:
      - Participation
      x-status: proposal-not-implemented
      x-required-permissions:
      - events.respond_self
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Sikeres válasz
          headers:
            X-Request-Id: *id001
            ETag: *id002
            Idempotency-Replayed:
              schema:
                type: boolean
              description: Igaz, ha egy korábbi eredményt játszottunk újra.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Participation'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '412':
          $ref: '#/components/responses/Error412'
        '428':
          $ref: '#/components/responses/Error428'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipationRequest'
  /organizations/{organization_id}/alerts:
    get:
      operationId: listAlerts
      summary: Saját riasztások vagy admin áttekintés
      description: Tag csak a saját címzettként kapott riasztásait látja; szervezeti admin az adott szervezet összes
        riasztását. Más szervezet riasztásának létezését sem árulja el.
      tags:
      - Alerts
      x-status: proposal-not-implemented
      x-required-permissions:
      - alerts.read
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Sikeres válasz
          headers:
            X-Request-Id: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertsPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
    post:
      operationId: createAlertDraft
      summary: Riasztástervezet létrehozása, küldés nélkül
      description: Csak szervezeti admin. Az esemény és minden tagság ugyanahhoz a szervezethez tartozzon, approved
        és riasztható legyen; a position_key a hitelesített beosztásból választható. Duplikált tagság/pozíció-slot
        tiltott, parancsnok és helyettes max.1. expires_at > now és <= esemény ends_at. draft állapot; nincs push
        mellékhatás.
      tags:
