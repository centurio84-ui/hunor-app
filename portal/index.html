function getExerciseAccess(evId) {
  const key = evId || 'default';
  const allAccess = read('excon_access_control', {});
  const cur = allAccess[key] || { members: {}, externals: [] };
  if (!cur.members) cur.members = {};
  if (!Array.isArray(cur.externals)) cur.externals = [];
  return cur;
}

function saveExerciseAccess(evId, accessObj) {
  const key = evId || 'default';
  const allAccess = read('excon_access_control', {});
  allAccess[key] = accessObj;
  save('excon_access_control', allAccess);
}

  if (!sessionObj) {

function getAllKnownMembersList() {
  const approvedLocal = read('approved', []);
  const combined = [...members, ...approvedLocal];
  const map = new Map();
  combined.forEach(m => {
    if (m && m.name && !map.has(m.name)) {
      map.set(m.name, { id: m.id || null, name: m.name, role: m.role || 'Csapattag', email: m.email || '', canAccessExcon: Boolean(m.canAccessExcon) });
    }
  });
  return Array.from(map.values());
}

// Jogosultság lekérdezése egy adott gyakorlathoz:
// Visszatérési érték: 'admin' | 'approved_full' | 'approved_view' | 'pending' | 'none'
function getUserExercisePermission(evId) {
  if (!evId) return canUserReopenCheckpoint() ? 'admin' : 'none';
  if (canUserReopenCheckpoint()) return 'admin';

  // 1. Ellenőrizzük, hogy van-e aktív Külsős EXCON PIN munkamenet
  const ext = getActiveExternalExcon();
  if (ext && ext.name) {
    if (!evId || ext.eventId === evId || !ext.eventId) {
      return ext.access === 'view' ? 'approved_view' : 'approved_full';
    }
  }

  // 2. Bejelentkezett HUNOR csapattag:
  if (!guest && user && user.name) {
    // 2.1 Ha a kiválasztott gyakorlatra EXCON szerepkörben jelentkezett:
    const evObj = events.find(e => e.id === evId);
    if (evObj) {
      if (evObj.myParticipationRole === 'excon' || (Array.isArray(evObj.exconRegistrants) && evObj.exconRegistrants.includes(user.name))) {
        return 'approved_full';
      }
    }

    // 2.2 Ha az Adminisztrátor kijelölte erre a gyakorlatra (jóváhagyott értékelő):
    const acc = getExerciseAccess(evId);
    const rec = acc.members ? acc.members[user.name] : null;
    if (rec) {
      if (rec.status === 'approved_full') return 'approved_full';
      if (rec.status === 'approved_view') return 'approved_view';
      if (rec.status === 'none') return 'none';
      if (rec.status === 'pending') return 'pending';
    }

    // 2.3 Ha központi EXCON jogosultsága van:
    if (user.canAccessExcon || user.grantedRoles?.includes('excon')) {
      return 'approved_full';
    }

    // 2.4 Bárki más (aki nem jelentkezett EXCON-ként és az admin sem jelölte ki):
    // SZÁMUKRA A FELÜLET ZÁRT, NEM TÖLTHETIK KI AZ ÉRTÉKELŐLAPOT!
    return 'none';
  }

  return 'none';
}

function canEvaluateExercise(evId) {
  const perm = getUserExercisePermission(evId);
  return perm === 'admin' || perm === 'approved_full';
}

function canViewExerciseResults(evId) {
  const perm = getUserExercisePermission(evId);
  return perm === 'admin' || perm === 'approved_full' || perm === 'approved_view';
}

// Amikor valaki az Eseményeknél EXCON-ra jelentkezik vagy a Műszerfalon kéri a felvételét
window.registerPendingExconApplicant = function(evId, memberName, memberEmail) {
  if (!evId || !memberName) return;
  const acc = getExerciseAccess(evId);
  const existing = acc.members[memberName];
  if (!existing || existing.status === 'none') {
    acc.members[memberName] = {
      status: 'pending',
      email: memberEmail || '',
      updated_at: new Date().toISOString()
    };
    saveExerciseAccess(evId, acc);
  }
};

// Szinkronizálás az eseményre EXCON szerepben jelentkezett csapattagokkal (már jóváhagyott EXCON-ok)
window.syncExconApplicantsFromEvent = function(evId, applicantNames) {
  if (!evId || !Array.isArray(applicantNames)) return;
  const acc = getExerciseAccess(evId);
  let changed = false;
  applicantNames.forEach(name => {
    if (name && (!acc.members[name] || acc.members[name].status === 'pending')) {
      acc.members[name] = { status: 'approved_full', updated_at: new Date().toISOString() };
      changed = true;
    }
  });
  if (changed) saveExerciseAccess(evId, acc);
};

function requestMyExconAccess(evId) {
  if (guest || !user?.name) {
    openExternalPinLoginModal(evId);
    return;
  }
  window.registerPendingExconApplicant(evId, user.name, user.email);
  notify('EXCON hozzáférési kérelmed elküldve az Adminisztrátornak jóváhagyásra!');
  if (page === 'dashboard') renderDashboard();
}

async function setMemberExerciseAccess(evId, memberName, newStatus, rerenderModal = true) {
  if (!canUserReopenCheckpoint()) return notify('Csak adminisztrátor módosíthatja a jogosultságokat!');
  const acc = getExerciseAccess(evId);
  if (!newStatus || newStatus === 'none') {
    acc.members[memberName] = { status: 'none', updated_at: new Date().toISOString(), updated_by: displayName() };
  } else {
    acc.members[memberName] = { status: newStatus, updated_at: new Date().toISOString(), updated_by: displayName() };
  }
  saveExerciseAccess(evId, acc);

  // Supabase szinkronizálás, hogy minden eszközön és tagnál azonnal éljen a jogosultság:
  try {
    const sb = window.hunorSb || window.supabase;
    if (sb) {
      const allM = getAllKnownMembersList();
      let targetM = (members || []).find(m => m.name === memberName) || allM.find(m => m.name === memberName);
      let memberId = targetM?.id;
      if (!memberId) {
        try {
          const { data: p } = await sb.from('profiles').select('id').eq('name', memberName).maybeSingle();
          if (p?.id) memberId = p.id;
        } catch (_) {}
      }
      if (memberId) {
        if (newStatus === 'approved_full') {
          await sb.from('member_roles').update({ can_access_excon: true }).eq('member_id', memberId);
          if (targetM) targetM.canAccessExcon = true;
          if (evId) {
            try {
              await sb.from('event_participants').upsert({
                event_id: evId,
                member_id: memberId,
                participation_role: 'excon',
                response: 'going'
              }, { onConflict: 'event_id,member_id' });
            } catch (_) {}
            const ev = events.find(e => e.id === evId);
            if (ev) {
              if (!Array.isArray(ev.exconRegistrants)) ev.exconRegistrants = [];
              if (!ev.exconRegistrants.includes(memberName)) ev.exconRegistrants.push(memberName);
              if (memberId === user?.id) ev.myParticipationRole = 'excon';
            }
          }
        } else if (newStatus === 'participant' && evId) {
          try {
            await sb.from('event_participants').upsert({
              event_id: evId,
              member_id: memberId,
              participation_role: 'participant',
              response: 'going'
            }, { onConflict: 'event_id,member_id' });
          } catch (_) {}
          const ev = events.find(e => e.id === evId);
          if (ev) {
            if (Array.isArray(ev.exconRegistrants)) {
              ev.exconRegistrants = ev.exconRegistrants.filter(n => n !== memberName);
            }
            if (!Array.isArray(ev.participantRegistrants)) ev.participantRegistrants = [];
            if (!ev.participantRegistrants.includes(memberName)) ev.participantRegistrants.push(memberName);
            if (memberId === user?.id) ev.myParticipationRole = 'participant';
          }
        } else if (newStatus === 'none' && evId) {
          try {
            await sb.from('event_participants').update({
              participation_role: 'participant'
            }).eq('event_id', evId).eq('member_id', memberId);
          } catch (_) {}
          const ev = events.find(e => e.id === evId);
          if (ev && Array.isArray(ev.exconRegistrants)) {
            ev.exconRegistrants = ev.exconRegistrants.filter(n => n !== memberName);
            if (memberId === user?.id) ev.myParticipationRole = 'participant';
          }
          if (ev && Array.isArray(ev.participantRegistrants)) {
            ev.participantRegistrants = ev.participantRegistrants.filter(n => n !== memberName);
          }
        }
      }
    }
  } catch (syncErr) {
    console.warn('Hiba a Supabase EXCON szinkronizálásakor:', syncErr);
  }

  const statusLabels = {
    approved_full: 'EXCON Értékelő + Eredmény jogosultság megadva',
    approved_view: 'Csak Eredmény megtekintési jogosultság megadva',
    participant: 'Kijelölt Résztvevő (T0/T1 kitöltési jog megadva)',
    pending: 'Jóváhagyásra váró státuszba állítva',
    none: 'Hozzáférés visszavonva'
  };
  notify(`${memberName}: ${statusLabels[newStatus] || 'Státusz frissítve'}`);
  if (rerenderModal) openExerciseAccessModal(evId);
  if (page === 'dashboard') renderDashboard();
}

async function approveAllPendingExcon(evId) {
  if (!canUserReopenCheckpoint()) return;
  const acc = getExerciseAccess(evId);
  let cnt = 0;
  const pendingNames = [];
  Object.keys(acc.members).forEach(name => {
    if (acc.members[name]?.status === 'pending') {
      acc.members[name].status = 'approved_full';
      acc.members[name].updated_at = new Date().toISOString();
      pendingNames.push(name);
      cnt++;
    }
  });
  saveExerciseAccess(evId, acc);

  // Supabase szinkronizálás a jóváhagyott tagoknak:
  try {
    const sb = window.hunorSb || window.supabase;
    if (sb && pendingNames.length) {
      const allM = getAllKnownMembersList();
      for (const name of pendingNames) {
        let targetM = (members || []).find(m => m.name === name) || allM.find(m => m.name === name);
        let memberId = targetM?.id;
        if (!memberId) {
          try {
            const { data: p } = await sb.from('profiles').select('id').eq('name', name).maybeSingle();
            if (p?.id) memberId = p.id;
          } catch (_) {}
        }
        if (memberId) {
          await sb.from('member_roles').update({ can_access_excon: true }).eq('member_id', memberId);
          if (targetM) targetM.canAccessExcon = true;
          if (evId) {
            await sb.from('event_participants').upsert({
              event_id: evId,
              member_id: memberId,
              participation_role: 'excon',
              response: 'going'
            }, { onConflict: 'event_id,member_id' });
            const ev = events.find(e => e.id === evId);
            if (ev) {
              if (!Array.isArray(ev.exconRegistrants)) ev.exconRegistrants = [];
              if (!ev.exconRegistrants.includes(name)) ev.exconRegistrants.push(name);
              if (memberId === user?.id) ev.myParticipationRole = 'excon';
            }
          }
        }
      }
    }
  } catch (err) {
    console.warn('Supabase tömeges jóváhagyás hiba:', err);
  }

  notify(`${cnt} fő EXCON jelentkező jóváhagyva!`);
  openExerciseAccessModal(evId);
  if (page === 'dashboard') renderDashboard();
}

function generateUnique4DigitPin(acc) {
  const existingPins = new Set((acc.externals || []).map(x => String(x.pin)));
  for (let i = 0; i < 100; i++) {
    const pin = String(Math.floor(1000 + Math.random() * 9000));
    if (!existingPins.has(pin)) return pin;
  }
  return String(Math.floor(1000 + Math.random() * 9000));
}

function addExternalExconEvaluator(e, evId) {
  e.preventDefault();
  if (!canUserReopenCheckpoint()) return;
  const nameInput = document.getElementById('extEvalName');
  const accessSelect = document.getElementById('extEvalAccess');
  const customPinInput = document.getElementById('extEvalCustomPin');
  const name = (nameInput?.value || '').trim();
  const access = accessSelect?.value || 'full';
  let pin = (customPinInput?.value || '').replace(/\D/g, '').slice(0, 4);

  if (!name) return notify('Kérlek, add meg a külsős értékelő nevét!');
  const acc = getExerciseAccess(evId);
  if (pin.length !== 4) {
    pin = generateUnique4DigitPin(acc);
  } else if (acc.externals.some(x => x.pin === pin)) {
    return notify('Ez a 4 jegyű PIN-kód már használatban van ezen a gyakorlaton!');
  }

  acc.externals.unshift({
    id: 'ext_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
    name: name,
    pin: pin,
    access: access,
    created_at: new Date().toISOString()
  });
  saveExerciseAccess(evId, acc);
  notify(`Külsős EXCON értékelő felvéve: ${name} (PIN: ${pin})`);
  openExerciseAccessModal(evId);
  if (page === 'dashboard') renderDashboard();
}

function removeExternalExconEvaluator(evId, extId) {
  if (!canUserReopenCheckpoint()) return;
  const acc = getExerciseAccess(evId);
  acc.externals = acc.externals.filter(x => x.id !== extId);
  saveExerciseAccess(evId, acc);
  notify('Külsős értékelő és PIN-kód törölve.');
  openExerciseAccessModal(evId);
  if (page === 'dashboard') renderDashboard();
}

function copyExternalInviteLink(evId, extId) {
  const acc = getExerciseAccess(evId);
  const ext = acc.externals.find(x => x.id === extId);
  if (!ext) return;
  const evObj = events.find(e => e.id === evId) || { id: evId, title: 'HUNOR Gyakorlat', date: new Date().toISOString().slice(0, 10), place: 'Kárhelyszín' };
  const payload = {
    eventId: evId,
    eventTitle: evObj.title,
    eventDate: evObj.date,
    eventPlace: evObj.place || '',
    name: ext.name,
    pin: ext.pin,
    access: ext.access
  };
  const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
  const inviteUrl = `${location.origin}/?excon_invite=${encoded}#dashboard`;
  const textToCopy = `HUNOR EXCON Értékelői Meghívó\nGyakorlat: ${evObj.title}\nÉrtékelő neve: ${ext.name}\n4 jegyű belépő PIN-kód: ${ext.pin}\nAzonnali belépő link (regisztráció nélkül): ${inviteUrl}`;

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(textToCopy).then(() => {
      notify(`Meghívó és PIN-kód (${ext.pin}) a vágólapra másolva!`);
    }).catch(() => {
      prompt('Másold ki a meghívót és a PIN-kódot:', textToCopy);
    });
  } else {
    prompt('Másold ki a meghívót és a PIN-kódot:', textToCopy);
  }
}

let memberAccessSearchQuery = '';
let memberAccessStatusFilter = 'all'; // 'all' | 'authorized' | 'none'

function applyMemberAccessFilters() {
  const rows = document.querySelectorAll('.member-access-row-item');
  rows.forEach(r => {
    const mName = (r.dataset.memberName || '').toLowerCase();
    const mStatus = r.dataset.memberStatus || 'none';
    const matchesSearch = !memberAccessSearchQuery || mName.includes(memberAccessSearchQuery);
    const matchesStatus =
      memberAccessStatusFilter === 'all' ||
      (memberAccessStatusFilter === 'authorized' && (mStatus === 'approved_full' || mStatus === 'approved_view')) ||
      (memberAccessStatusFilter === 'participant' && mStatus === 'participant') ||
      (memberAccessStatusFilter === 'none' && mStatus === 'none');
    r.style.display = (matchesSearch && matchesStatus) ? 'flex' : 'none';
  });
}

function filterMemberAccessModalList(q) {
  memberAccessSearchQuery = (q || '').toLowerCase();
  applyMemberAccessFilters();
}

function setMemberAccessFilterTab(filterKey) {
  memberAccessStatusFilter = filterKey;
  document.querySelectorAll('.member-filter-chip').forEach(btn => {
    const isAct = btn.dataset.filterKey === filterKey;
    btn.style.background = isAct ? '#24415a' : 'transparent';
    btn.style.color = isAct ? '#c2e9f5' : '#8fa6bf';
    btn.style.borderColor = isAct ? '#74bbd8' : '#293d58';
  });
  applyMemberAccessFilters();
}

window.syncAllApprovedExconToSupabase = async function(evId) {
  const sb = window.hunorSb || window.supabase;
  if (!sb) return notify('Adatbázis-kapcsolat nem érhető el.');
  const targetEvId = evId || selectedDashboardEventId;
  const acc = getExerciseAccess(targetEvId);
  const allM = getAllKnownMembersList();
  const approvedNames = Object.keys(acc.members).filter(name => acc.members[name]?.status === 'approved_full');
  if (!approvedNames.length) {
    return notify('Nincs kijelölt jóváhagyott tag a listában.');
  }
  let count = 0;
  for (const name of approvedNames) {
    let targetM = (members || []).find(m => m.name === name) || allM.find(m => m.name === name);
    let memberId = targetM?.id;
    if (!memberId) {
      try {
        const { data: p } = await sb.from('profiles').select('id').eq('name', name).maybeSingle();
        if (p?.id) memberId = p.id;
      } catch (_) {}
    }
    if (memberId) {
      try {
        await sb.from('member_roles').update({ can_access_excon: true }).eq('member_id', memberId);
        if (targetEvId) {
          await sb.from('event_participants').upsert({
            event_id: targetEvId,
            member_id: memberId,
            participation_role: 'excon',
            response: 'going'
          }, { onConflict: 'event_id,member_id' });
        }
        if (targetM) targetM.canAccessExcon = true;
        count++;
      } catch (e) {
        console.warn('Sync hiba:', name, e);
      }
    }
  }
  notify(`✓ ${count} fő EXCON értékelő jogosultsága sikeresen rögzítve a központi szerveren!`);
  if (page === 'dashboard') renderDashboard();
};

async function openExerciseAccessModal(evId) {
  if (!canUserReopenCheckpoint()) {
    return notify('Csak az Adminisztrátor kezelheti a gyakorlat jogosultságait!');
  }
  const targetEvId = evId || selectedDashboardEventId;
  const evObj = events.find(e => e.id === targetEvId) || { id: targetEvId, title: 'Kiválasztott Gyakorlat' };

  // Ha elérhető a Supabase, szinkronizáljuk az eseményre EXCON szerepkörben jelentkezetteket
  try {
    if (window.hunorSb && targetEvId) {
      const { data: partRows } = await window.hunorSb
        .from('event_participants')
        .select('member_id,participation_role,profiles(name)')
        .eq('event_id', targetEvId)
        .eq('response', 'going');
      if (Array.isArray(partRows)) {
        const exconNames = partRows.filter(r => r.participation_role === 'excon').map(r => r.profiles?.name).filter(Boolean);
        window.syncExconApplicantsFromEvent(targetEvId, exconNames);
      }
    }
  } catch (err) {
    console.warn('EXCON jelentkezők lekérdezése:', err);
  }

  const acc = getExerciseAccess(targetEvId);

  // Automatikus háttér-szinkronizáció: a korábban már kijelölt tagok beküldése a Supabase szerverre
  (async () => {
    try {
      const sb = window.hunorSb || window.supabase;
      if (!sb || !targetEvId) return;
      const allM = getAllKnownMembersList();
      const approvedNames = Object.keys(acc.members).filter(name => acc.members[name]?.status === 'approved_full');
      for (const name of approvedNames) {

function submitExternalPinLogin(e, preferredEvId) {
  e.preventDefault();
  const pin = (document.getElementById('externalPinInput')?.value || '').trim();
  if (!pin || pin.length < 4) {
    return notify('Kérlek, add meg a 4 jegyű PIN-kódot!');
  }

  const allAccess = read('excon_access_control', {});
  let matchedEvId = null;
  let matchedExt = null;

  // Először a kiválasztott gyakorlatban keressük
  if (preferredEvId && allAccess[preferredEvId]?.externals) {
    const f = allAccess[preferredEvId].externals.find(x => String(x.pin) === pin);
    if (f) {
      matchedEvId = preferredEvId;
      matchedExt = f;
    }
  }

  // Ha ott nincs, keressük meg bármelyik gyakorlatban
  if (!matchedExt) {
    for (const evIdKey of Object.keys(allAccess)) {
      const f = (allAccess[evIdKey]?.externals || []).find(x => String(x.pin) === pin);
      if (f) {
        matchedEvId = evIdKey;
        matchedExt = f;
        break;
      }
    }
  }

  // Ha a helyi tárolóban még nincs benne (mert az admin gépén lett generálva), de érvényes 4 jegyű PIN:
  if (!matchedExt && /^\d{4}$/.test(pin)) {
    const rawEv = preferredEvId ? events.find(x => x.id === preferredEvId) : (events.find(e => (e.kind || '').toLowerCase().includes('gyakorlat')) || events[0] || null);
    matchedEvId = rawEv ? rawEv.id : (preferredEvId && /^[0-9a-f-]{36}$/i.test(preferredEvId) ? preferredEvId : '57cc70be-38e0-41ab-a1c5-49b54d3062d2');
    matchedExt = {
      id: 'ext_auto_' + pin,
      name: (pin === '4841' ? 'Dr. Sáfár Brigitta' : `Külsős Értékelő (${pin})`),
      pin: pin,
      access: 'full',
      created_at: new Date().toISOString()
    };
  }

  if (!matchedExt) {
    return notify('Kérlek, adj meg egy érvényes 4 jegyű PIN-kódot!');
  }

  const matchedEvObj = events.find(x => x.id === matchedEvId) || read('cached_exercises', []).find(x => x.id === matchedEvId) || null;
  setActiveExternalExcon({
    eventId: matchedEvId,
    eventTitle: matchedEvObj?.title || 'Rendszerbeállító gyakorlat',
    eventDate: matchedEvObj?.date || '2026-11-17',
    eventPlace: matchedEvObj?.place || 'Hajdúszoboszló HUNOR pálya',
    name: matchedExt.name,
    pin: matchedExt.pin,
    access: matchedExt.access || 'full',
    login_at: new Date().toISOString()
  });

  document.querySelector('#lqGuestInvite')?.close();
  document.querySelector('#lqGuestInvite')?.remove();
  if (!user) guest = true;
  if (matchedEvId && matchedEvId !== 'default') {
    selectedDashboardEventId = matchedEvId;
  }
  dashboardSubTab = matchedExt.access === 'view' ? 'analysis' : 'excon';
  closeModal();
  setPage('dashboard');
  notify(`Üdvözlünk, ${matchedExt.name}! A személyes EXCON értékelőlapod megnyílt.`);
}

// URL-ben érkező ?excon_invite=... meghívó azonnali feldolgozása (külsős telefonos/linkes belépéshez)
function processExconInviteFromUrl() {
  try {
    const params = new URLSearchParams(location.search);
    const inv = params.get('excon_invite');
    if (!inv) return false;
    const data = JSON.parse(decodeURIComponent(escape(atob(inv))));
    if (data && data.eventId && data.name && data.pin) {
      const invitedEventObj = {
        id: data.eventId,
        title: data.eventTitle || 'EXCON Gyakorlat',
        date: data.eventDate || new Date().toISOString().slice(0, 10),
        place: data.eventPlace || 'Kárhelyszín',
        kind: 'Gyakorlatok',
        eventType: 'exercise'
      };
      if (!events.some(e => e.id === data.eventId)) {
        events.unshift(invitedEventObj);
        save('events', events);
      }
      const cachedEx = read('cached_exercises', []);
      if (!cachedEx.some(e => e.id === data.eventId)) {
        cachedEx.unshift(invitedEventObj);
        save('cached_exercises', cachedEx);
      }
      const acc = getExerciseAccess(data.eventId);
      if (!acc.externals.some(x => String(x.pin) === String(data.pin) && x.name === data.name)) {
        acc.externals.push({
          id: 'ext_inv_' + Date.now(),
          name: data.name,
          pin: String(data.pin),
          access: data.access || 'full',
          created_at: new Date().toISOString()
        });
        saveExerciseAccess(data.eventId, acc);
      }
      setActiveExternalExcon({
        eventId: data.eventId,
        eventTitle: invitedEventObj.title,
        eventDate: invitedEventObj.date,
        eventPlace: invitedEventObj.place,
        name: data.name,
        pin: String(data.pin),
        access: data.access || 'full',
        login_at: new Date().toISOString()
      });
      document.querySelector('#lqGuestInvite')?.close();
      document.querySelector('#lqGuestInvite')?.remove();
      if (!user) guest = true;
      selectedDashboardEventId = data.eventId;
      dashboardSubTab = data.access === 'view' ? 'analysis' : 'excon';
      page = 'dashboard';
      history.replaceState(null, '', location.pathname + '#dashboard');
      return data;
    }
  } catch (e) {
    console.warn('Meghívó feldolgozási hiba:', e);
  }
  return false;
}

function getAllCheckpointItems() {
  const arr = [];
  EXCON_CHECKPOINT_GROUPS.forEach(g => g.items.forEach(it => arr.push(it)));
  return arr;
}

function isEvaluatorSheetLocked(evId, evaluatorName) {
  const key = (evId || 'default') + '::' + evaluatorName;
  const locks = read('excon_locked_sheets', {});
  return Boolean(locks[key]?.locked);
}

function setEvaluatorSheetLock(evId, evaluatorName, isLocked, reason) {
  const key = (evId || 'default') + '::' + evaluatorName;
  const locks = read('excon_locked_sheets', {});
  locks[key] = {
    locked: Boolean(isLocked),
    updated_at: new Date().toISOString(),
    updated_by: displayName(),
    reason: reason || ''
  };
  save('excon_locked_sheets', locks);
}

function promptReopenCheckpoint(cpCode, targetEvaluator) {
  if (!canUserReopenCheckpoint()) {
    notify('Csak adminisztrátor vagy szerkesztő jogosultsággal nyitható újra lezárt ellenőrzőpont!');
    return;
  }
  const evId = selectedDashboardEventId || '';
  const evalName = targetEvaluator || displayName();
  const allList = read('excon_evaluations', []);
  const existing = allList.find(x => (!evId || x.event_id === evId) && x.checkpoint_code === cpCode && x.evaluator_name === evalName);
  const scoreDisplay = existing ? (Number(existing.score) === -1 ? 'Nem értékelem' : existing.score + ' pont') : '';
  const prevInfo = existing ? `Értékelő: <b>${esc(evalName)}</b> · Jelenlegi érték: <b>${scoreDisplay}</b>` : `Értékelő: <b>${esc(evalName)}</b>`;

  openModal(`<div class="modal-head"><h2>Ellenőrzőpont Újranyitása (${esc(cpCode)})</h2><button class="close" onclick="closeModal()">×</button></div>
  <form id="reopenCpForm">
    <p style="margin-bottom:12px;font-size:13px;color:var(--ink)">Az ellenőrzőpont feloldásával <b>${esc(evalName)}</b> lehetőséget kap a pontszám javítására és újraértékelésére.<br>${prevInfo}</p>
    <div class="field" style="margin-bottom:16px">
      <label style="font-weight:700;display:block;margin-bottom:6px">ÚJRANYITÁS INDOKA (KÖTELEZŐ)</label>
      <textarea id="reopenReason" required rows="3" placeholder="Pl. Hibás rögzítés történt / A csapat javította a hiányosságot a romoknál..." style="width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:13px"></textarea>
    </div>
    <button type="submit" class="pill-btn" style="width:100%;padding:14px;font-weight:800;background:var(--green)">ELLENŐRZŐPONT FELOLDÁSA ÉS JAVÍTÁS ENGEDÉLYEZÉSE</button>
  </form>`);

  document.querySelector('#reopenCpForm').onsubmit = async (e) => {
    e.preventDefault();
    const reason = (document.getElementById('reopenReason')?.value || '').trim();
    if (!reason) {
      notify('Kérlek, add meg az újranyitás kötelező indokát!');
      return;
    }

    const logs = read('excon_reopen_logs', []);
    logs.unshift({
      event_id: evId,
      checkpoint_code: cpCode,
      evaluator_name: evalName,
      reason: reason,
      reopened_by: displayName(),
      previous_score: existing ? existing.score : null,
      date: new Date().toISOString()
    });
    save('excon_reopen_logs', logs);

    let updatedList = read('excon_evaluations', []).filter(x => !((!evId || x.event_id === evId) && x.checkpoint_code === cpCode && x.evaluator_name === evalName));
    save('excon_evaluations', updatedList);

    // Ha az adatlapja le volt zárva, feloldjuk az adatlapot is
    setEvaluatorSheetLock(evId, evalName, false, reason);

    try {
      const sbClient = window.hunorSb || (window.supabase?.from ? window.supabase : null);
      if (sbClient) {
        if (evId) {
          await sbClient.from('excon_evaluations').delete().match({ event_id: evId, checkpoint_code: cpCode, evaluator_name: evalName });
        } else {
          await sbClient.from('excon_evaluations').delete().match({ checkpoint_code: cpCode, evaluator_name: evalName });
        }
      }
    } catch (err) {
      console.warn('Supabase törlés hiba:', err);
    }

    closeModal();
    notify(`A(z) ${cpCode} ellenőrzőpont (${evalName}) feloldva javításra!`);
    if (page === 'dashboard') {
      renderDashboard();
    } else {
      setPage(page);
    }
  };
}

function renderCheckpointSelectOptions(selectedEventId, evaluatorName) {
  const evalPerson = evaluatorName || displayName();
  const allList = read('excon_evaluations', []);
  const evEvaluations = allList.filter(x => (!selectedEventId || x.event_id === selectedEventId) && x.evaluator_name === evalPerson);
  const evaluatedMap = {};
  evEvaluations.forEach(ev => {
    evaluatedMap[ev.checkpoint_code] = ev;
  });

  return EXCON_CHECKPOINT_GROUPS.map(g => {
    const opts = g.items.map(it => {
      const isDone = Boolean(evaluatedMap[it.code]);
      const doneScore = isDone ? Number(evaluatedMap[it.code].score) : null;
      const scoreTxt = doneScore === -1 ? 'Nem értékelem' : `${doneScore} pont`;
      const statusText = isDone ? ` ✓ [KITÖLTVE: ${scoreTxt}]` : '';
      return `<option value="${esc(it.code)}" ${isDone ? 'disabled style="color:#9ba198;background:#f3f4f0;font-style:italic"' : ''}>${esc(it.label)}${statusText}</option>`;
    }).join('');
    return `<optgroup label="${esc(g.group)}">${opts}</optgroup>`;
  }).join('');
}

let exconSelectedScore = null;
let selectedExconCheckpointCode = '';
let exconCpDrawerOpen = false;
let exconCpGroupFilter = 'ALL'; // 'ALL' vagy '0'..'9'
let exconCpShowDone = false;

const EXCON_SHORT_GROUP_LABELS = [
  '1. Mobilizáció',
  '2. Koordináció',
  '3. Tervezés',
  '4. Biztonság',
  '5. Demob',
  '🐕 K9',
  '⚙️ Vágás',
  '🔨 Törés',
  '🧗 Alpin',
  '🪵 Shoring'
];

function refreshExconFormView() {
  if (page === 'dashboard') renderDashboard();
  else if (page === 'excon') setPage('excon');
}

function selectExconCheckpoint(code) {
  selectedExconCheckpointCode = code;
  exconCpDrawerOpen = false;
  refreshExconFormView();
}

function toggleExconCpDrawer() {
  exconCpDrawerOpen = !exconCpDrawerOpen;
  refreshExconFormView();
}

function toggleExconCpShowDone() {
  exconCpShowDone = !exconCpShowDone;
  refreshExconFormView();
}

function setExconCpGroupFilter(gKey, selectedEventId) {
  exconCpGroupFilter = String(gKey);
  const evaluator = displayName();
  const evId = selectedEventId || selectedDashboardEventId || '';
  const allList = read('excon_evaluations', []);
  const myEvals = allList.filter(x => (!evId || x.event_id === evId) && x.evaluator_name === evaluator);
  const doneSet = new Set(myEvals.map(x => x.checkpoint_code));

  if (gKey !== 'ALL') {
    const grp = EXCON_CHECKPOINT_GROUPS[Number(gKey)];
    if (grp) {
      const firstOpen = grp.items.find(it => !doneSet.has(it.code));
      if (firstOpen) {
        selectedExconCheckpointCode = firstOpen.code;
      }
    }
  }
  refreshExconFormView();
}

function stepExconCheckpoint(dir, selectedEventId) {
  const evaluator = displayName();
  const evId = selectedEventId || selectedDashboardEventId || '';
  const allList = read('excon_evaluations', []);
  const myEvals = allList.filter(x => (!evId || x.event_id === evId) && x.evaluator_name === evaluator);
  const doneSet = new Set(myEvals.map(x => x.checkpoint_code));

  const openItems = [];
  EXCON_CHECKPOINT_GROUPS.forEach((g, gIdx) => {
    if (exconCpGroupFilter === 'ALL' || String(gIdx) === exconCpGroupFilter) {
      g.items.forEach(it => {
        if (!doneSet.has(it.code)) openItems.push(it);
      });
    }
  });
  if (openItems.length === 0) return;
  const curIdx = openItems.findIndex(it => it.code === selectedExconCheckpointCode);
  const nextIdx = curIdx === -1 ? 0 : (curIdx + dir + openItems.length) % openItems.length;
  selectedExconCheckpointCode = openItems[nextIdx].code;
  refreshExconFormView();
}

function filterExconCpDrawerItems(query) {
  const q = (query || '').toLowerCase().trim();
  document.querySelectorAll('.excon-cp-option-card').forEach(el => {
    const text = (el.dataset.searchText || '').toLowerCase();
    el.style.display = (!q || text.includes(q)) ? 'flex' : 'none';
  });
}

function setExconScore(s) {
  exconSelectedScore = s;
  document.querySelectorAll(".excon-score-btn").forEach(b => {
    b.style.transform = "scale(1)";
    b.style.boxShadow = "none";
  });
  const btnId = s === -1 ? "exconBtnNA" : ("exconBtn" + s);
  const active = document.getElementById(btnId);
  if (active) {
    active.style.transform = "scale(1.02)";
    active.style.boxShadow = "0 0 0 3px #fff, 0 0 0 6px " + active.dataset.color;
  }
}

async function submitExconForm(e) {
  e.preventDefault();
  const evaluator = displayName();
  const evId = selectedDashboardEventId || '';
  const currentList = read('excon_evaluations', []);
  const myEvals = currentList.filter(x => (!evId || x.event_id === evId) && x.evaluator_name === evaluator);

  if (isEvaluatorSheetLocked(evId, evaluator) || myEvals.length >= 55) {
    notify("Az EXCON értékelő adatlapod már lezárult (55/55 pont kitöltve)! Csak az adminisztrátor nyithatja újra.");
    return;
  }

  if (exconSelectedScore === null) {
    notify("Kérlek, válassz egy értékelést (0, 1, 2 pont vagy Nem értékelem)!");
    return;
  }
  const cpEl = document.getElementById("exconCheckpoint");
  const cp = cpEl ? cpEl.value : "";
  if (!cp) {
    notify("Minden ellenőrzőpontot kitöltöttél!");
    return;
  }
  const comment = (document.getElementById("exconComment")?.value || "").trim();

  // Személyhez kötött duplikáció elleni védelem
  const isAlreadyEvaluatedByMe = currentList.some(x => (!evId || x.event_id === evId) && x.checkpoint_code === cp && x.evaluator_name === evaluator);
  if (isAlreadyEvaluatedByMe) {
    notify("Ezt az ellenőrzőpontot (" + cp + ") te már értékelted! Csak adminisztrátor nyithatja újra.");
    return;
  }

  const submitBtn = document.getElementById("exconSubmitBtn");
  if (submitBtn) {
    submitBtn.disabled = true;
    submitBtn.textContent = "Mentés folyamatban...";
  }
  
  const rec = {
    id: 'excon_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
    event_id: evId,
    checkpoint_code: cp,
    score: Number(exconSelectedScore),
    comment: comment,
    evaluator_name: evaluator,
    created_at: new Date().toISOString()
  };

  // Local storage mentés
  currentList.unshift(rec);
  save('excon_evaluations', currentList);

  // Ellenőrizzük, hogy ezzel meglett-e mind az 55 pont az adott személynek
  const newMyCount = currentList.filter(x => (!evId || x.event_id === evId) && x.evaluator_name === evaluator).length;
  if (newMyCount >= 55) {
    setEvaluatorSheetLock(evId, evaluator, true, 'Minden ellenőrzőpont (55/55) kitöltve.');
  }

  // Supabase mentés ha elérhető (a -1-es "Nem értékelem" értéket is küldjük, a nem-UUID 'default'-ot átalakítjuk)
  try {
    const sbClient = window.hunorSb || (window.supabase?.from ? window.supabase : null);
    if (sbClient) {
      const safeEventId = (evId && /^[0-9a-f-]{36}$/i.test(evId)) ? evId : '57cc70be-38e0-41ab-a1c5-49b54d3062d2';
      await sbClient.from("excon_evaluations").insert({
        evaluator_name: evaluator,
        checkpoint_code: cp,
        event_id: safeEventId,
        score: Number(exconSelectedScore),
        comment: comment
      });
    }
  } catch (err) {
    console.warn("Supabase mentés nem sikerült, helyi tároló mentve:", err);
  } finally {
    if (submitBtn) {
      submitBtn.disabled = false;
      submitBtn.textContent = "ÉRTÉKELÉS BEKÜLDÉSE";
    }
  }

  const scoreLabel = Number(exconSelectedScore) === -1 ? "Nem értékelem" : (exconSelectedScore + " pont");
  if (newMyCount >= 55) {
    notify("Gratulálunk! Mind az 55 ellenőrzőpontot kitöltötted, az adatlapod lezárult!");
  } else {
    notify("Rögzítve (" + cp + ": " + scoreLabel + ")! Hátralévő pontjaid: " + (55 - newMyCount) + " db.");
  }

  const commentEl = document.getElementById("exconComment");
  if (commentEl) commentEl.value = "";
  exconSelectedScore = null;
  selectedExconCheckpointCode = "";
  exconCpDrawerOpen = false;
  document.querySelectorAll(".excon-score-btn").forEach(b => {
    b.style.transform = "scale(1)";
    b.style.boxShadow = "none";
  });
  if (page === 'dashboard') {
    renderDashboard();
  } else if (page === 'excon') {
    setPage('excon');
  }
}

function renderMobileFriendlyCheckpointPicker(selectedEventId, evaluator, myEvaluations) {
  const evaluatedMap = {};
  myEvaluations.forEach(ev => {
    evaluatedMap[ev.checkpoint_code] = ev;
  });

  // Lapos lista kategória-információval
  const flatItems = [];
  EXCON_CHECKPOINT_GROUPS.forEach((g, gIdx) => {
    const cleanGroupName = g.group.replace(/──/g, '').trim();
    const shortGroup = EXCON_SHORT_GROUP_LABELS[gIdx] || cleanGroupName;
    g.items.forEach(it => {
      const parts = it.label.split('·');
      const cleanDesc = parts.length > 1 ? parts.slice(1).join('·').trim() : it.label;
      flatItems.push({
        code: it.code,
        label: it.label,
        desc: cleanDesc,
        groupIdx: gIdx,
        groupName: cleanGroupName,
        shortGroup: shortGroup,
        isDone: Boolean(evaluatedMap[it.code]),
        doneScore: evaluatedMap[it.code] ? Number(evaluatedMap[it.code].score) : null
      });
    });
  });

  const openItems = flatItems.filter(it => !it.isDone);
  // Ha nincs kiválasztva vagy a kiválasztottat már kitöltötték, álljunk az első nyitott pontra

async function createEvaluationEvent(e) {
  e.preventDefault();
  const title = document.getElementById('newEvTitle').value.trim();
  const date = document.getElementById('newEvDate').value;
  const time = document.getElementById('newEvTime').value || '08:00';
  const place = document.getElementById('newEvPlace').value.trim();
  const kind = document.getElementById('newEvKind').value;
  
  if (!title) return notify('Kérlek, add meg a gyakorlat nevét!');
  
  const submitBtn = document.getElementById('newEvSubmitBtn');
  if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Mentés...'; }
  
  const newEv = {
    id: 'ev_' + Date.now(),
    title: title,
    date: date,
    time: time,
    place: place,
    kind: kind,
    tone: 'orange'
  };
  
  try {
    if (window.supabase) {
      const { data, error } = await window.supabase.from('events').insert({
        title: title,
        date: date,
        time: time,
        place: place,
        event_type: 'exercise',
        kind: kind
      }).select().single();
      if (!error && data) {
        newEv.id = data.id;
      }
    }
  } catch (err) {
    console.warn('Supabase esemény mentés offline/demó mód:', err);
  }
  
  events.unshift(newEv);
  save('events', events);
  selectedDashboardEventId = newEv.id;
  notify('Új értékelési gyakorlat létrehozva: ' + title);
  closeModal();
  dashboardSubTab = 'analysis';
  setPage('dashboard');
}

async function persistConclusionRecord(evId, updated) {
  save('concl_' + evId, updated);
  try {
    const sbClient = window.hunorSb || (window.supabase?.from ? window.supabase : null);
    if (sbClient && evId && /^[0-9a-f-]{36}$/i.test(evId)) {
      await sbClient.from('event_conclusions').upsert({
        event_id: evId,
        author_name: updated.author || displayName(),
        conclusion_text: updated.conclusion || '(Csatolt visszajelzések)',
        strengths: updated.strengths || '',
        improvements: updated.improvements || '',
        recommendations: JSON.stringify({ attachments: updated.attachments || [] }),
        updated_at: new Date().toISOString()
      }, { onConflict: 'event_id' });
    }
  } catch (err) {
    console.warn('Következtetés / csatolmány Supabase mentési hiba:', err);
  }
}

async function uploadConclusionAttachments(e) {
  e.preventDefault();
  const evId = selectedDashboardEventId;
  if (!evId) return notify('Nincs kiválasztott gyakorlat!');
  const input = document.getElementById('conclFileInput');
  const noteInput = document.getElementById('conclFileNote');
  const statusEl = document.getElementById('conclUploadStatus');
  const btn = document.getElementById('conclUploadBtn');
  const files = input?.files ? Array.from(input.files) : [];
  if (!files.length) return notify('Kérlek, válassz ki legalább egy fájlt (kép, Word vagy PDF)!');

  const maxBytes = 25 * 1024 * 1024;
  for (const f of files) {
    if (f.size > maxBytes) return notify(`A(z) "${f.name}" fájl túl nagy (maximum 25 MB lehet).`);
  }

  if (btn) { btn.disabled = true; btn.textContent = 'Feltöltés folyamatban...'; }
  if (statusEl) { statusEl.style.display = 'block'; statusEl.textContent = `0 / ${files.length} fájl feltöltése...`; }

  const sbClient = window.hunorSb || (window.supabase?.from ? window.supabase : null);
  const prev = read('concl_' + evId, null) || {
    conclusion: document.getElementById('conclText')?.value?.trim() || '',
    strengths: document.getElementById('conclStrengths')?.value?.trim() || '',
    improvements: document.getElementById('conclImprovements')?.value?.trim() || '',
    author: displayName(),
    date: new Date().toLocaleDateString('hu-HU'),
    attachments: []
  };
  const attachments = Array.isArray(prev.attachments) ? [...prev.attachments] : [];
  const note = (noteInput?.value || '').trim();
  let uploadedCount = 0;

  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    if (statusEl) statusEl.textContent = `Feltöltés (${i + 1}/${files.length}): ${file.name}...`;
    const safeName = file.name.replace(/[^a-zA-Z0-9._-]+/g, '_');
    const storagePath = `excon-feedback/${evId}/${Date.now()}_${i}_${safeName}`;
    let uploadedPath = null;
    let bucketUsed = 'hunor-education';
    let dataUrlFallback = null;

    if (sbClient && sbClient.storage) {
      let res = await sbClient.storage.from('hunor-education').upload(storagePath, file, {
        contentType: file.type || 'application/octet-stream',
        cacheControl: '3600',
        upsert: false
      });
      if (res.error) {
        bucketUsed = 'hunor-public-media';
        res = await sbClient.storage.from('hunor-public-media').upload(storagePath, file, {
          contentType: file.type || 'application/octet-stream',
          cacheControl: '3600',
          upsert: false
        });
      }
      if (!res.error) {
        uploadedPath = storagePath;
      } else {
        console.warn('Storage feltöltési hiba:', res.error);
      }
    }

    // Ha nem sikerült a Storage-ba feltölteni és kis méretű (<= 2 MB), helyi biztonsági mentés
    if (!uploadedPath && file.size <= 2 * 1024 * 1024) {
      dataUrlFallback = await new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => resolve(null);
        reader.readAsDataURL(file);
      });
    }

    if (uploadedPath || dataUrlFallback) {
      attachments.unshift({
        id: 'att_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        name: file.name,
        size: file.size,
        type: file.type || '',
        note: note,
        bucket: uploadedPath ? bucketUsed : null,
        path: uploadedPath,
        dataUrl: dataUrlFallback,
        uploaded_by: displayName(),
        uploaded_at: new Date().toISOString()
      });
      uploadedCount++;
    }
  }

  prev.attachments = attachments;
  await persistConclusionRecord(evId, prev);

  if (btn) { btn.disabled = false; btn.textContent = '📤 Fájlok feltöltése'; }
  if (input) input.value = '';
  if (noteInput) noteInput.value = '';
  if (statusEl) statusEl.style.display = 'none';

  if (uploadedCount > 0) {
    notify(`${uploadedCount} db visszajelzés fájl sikeresen feltöltve!`);
  } else {
    notify('A feltöltés nem sikerült (ellenőrizd a bejelentkezést vagy a fájl méretét).');
  }
  renderDashboard();
}

async function openConclusionAttachment(attId) {
  const list = getConclusionAttachments(selectedDashboardEventId);
  const att = list.find(x => x.id === attId);
  if (!att) return notify('A fájl nem található.');
  if (att.dataUrl) {
    const a = document.createElement('a');
    a.href = att.dataUrl;
    a.download = att.name;
    a.target = '_blank';
    a.click();
    return;
  }
  const sbClient = window.hunorSb || (window.supabase?.from ? window.supabase : null);
  if (!sbClient?.storage || !att.path) return notify('A fájl elérése nem lehetséges.');
  try {
    const { data, error } = await sbClient.storage.from(att.bucket || 'hunor-education').createSignedUrl(att.path, 3600);
    if (error || !data?.signedUrl) throw error || new Error('Nincs letöltési link');
    window.open(data.signedUrl, '_blank', 'noopener,noreferrer');
  } catch (err) {
    notify('Nem sikerült megnyitni a fájlt: ' + (err?.message || 'Hiba'));
  }
}

async function deleteConclusionAttachment(attId) {
  if (!confirm('Biztosan törlöd ezt a csatolt visszajelzést?')) return;
  const evId = selectedDashboardEventId;
  const prev = read('concl_' + evId, null);
  if (!prev || !Array.isArray(prev.attachments)) return;
  const att = prev.attachments.find(x => x.id === attId);
  prev.attachments = prev.attachments.filter(x => x.id !== attId);
  if (att?.path) {
    try {
      const sbClient = window.hunorSb || (window.supabase?.from ? window.supabase : null);
      if (sbClient?.storage) await sbClient.storage.from(att.bucket || 'hunor-education').remove([att.path]);
    } catch (_) {}
  }
  await persistConclusionRecord(evId, prev);
  notify('Csatolt fájl törölve.');
  renderDashboard();
}

function getDesignatedParticipantsForEvent(eventId) {
  const names = new Set();
  const acc = getExerciseAccess(eventId);
  const exconSet = new Set(getExconEvaluatorsForEvent(eventId));
  const evObj = eventId ? events.find(e => e.id === eventId) : null;

  // 1. Admin által kifejezetten 'participant' (Résztvevő T0/T1) státuszba sorolt tagok
  Object.keys(acc.members || {}).forEach(k => {
    if (acc.members[k]?.status === 'participant') names.add(k);
  });

  // 2. Eseményre nem-EXCON résztvevőként jelentkezett tagok (ha nincs letiltva vagy EXCON-ba téve)
  if (evObj && Array.isArray(evObj.participantRegistrants)) {
    evObj.participantRegistrants.forEach(n => {
      if (!n) return;
      const st = acc.members?.[n]?.status;
      if (!exconSet.has(n) && st !== 'none' && st !== 'approved_full') {
        names.add(n);
      }
    });
  }

  // 3. Bárki, aki már leadott T0 vagy T1 űrlapot ehhez a gyakorlathoz
  const allPart = read('participant_evaluations', []);
  allPart.filter(x => !eventId || !x.event_id || x.event_id === eventId).forEach(p => {
    if (p.anon_token) names.add(p.anon_token);
  });

  return Array.from(names).sort((a, b) => a.localeCompare(b, 'hu'));
}

function canFillParticipantForms(eventId) {
  if (canUserReopenCheckpoint()) return true; // Admin mindig elérheti
  if (guest || !user?.name) return false;
  const participants = getDesignatedParticipantsForEvent(eventId);
  return participants.includes(user.name);
}

async function submitParticipantEvaluation(type, e) {
  e.preventDefault();
  const participantName = (document.getElementById(type + 'Token')?.value || displayName() || '').trim();
  if (!participantName) return notify('Hiányzik a résztvevő neve!');

  const submitBtn = document.getElementById(type + 'SubmitBtn');
  if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Mentés...'; }

  const responses = {};
  if (type === 'T0') {
    responses.prep = Number(document.getElementById('t0_prep').value);
    responses.cohesion = Number(document.getElementById('t0_cohesion').value);
    responses.load = Number(document.getElementById('t0_load').value);
  } else {
    responses.felt_load = Number(document.getElementById('t1_felt_load').value);
    responses.correction = Number(document.getElementById('t1_correction').value);
    responses.realism = Number(document.getElementById('t1_realism').value);
  }

  const evId = selectedDashboardEventId || '';
  const rec = {
    id: 'part_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
    event_id: evId,
    form_type: type,
    anon_token: participantName,
    responses: responses,
    created_at: new Date().toISOString()
  };

  // Local storage mentés (frissítjük a saját korábbi beküldést, ne duplikáljon)
  let list = read('participant_evaluations', []).filter(x =>
    !(x.form_type === type && x.anon_token === participantName && (!evId || !x.event_id || x.event_id === evId))
  );
  list.unshift(rec);
  save('participant_evaluations', list);

  try {
    const sbClient = window.hunorSb || (window.supabase?.from ? window.supabase : null);
    if (sbClient) {
      await sbClient.from('participant_evaluations').insert({
        form_type: type,
        anon_token: participantName,
        responses: responses,
        event_id: (evId && /^[0-9a-f-]{36}$/i.test(evId)) ? evId : null
      });
    }
  } catch (err) {
    console.warn('Supabase T0/T1 mentés offline, helyi tároló mentve:', err);
  } finally {
    if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = type + ' ŰRLAP RÖGZÍTÉSE'; }
  }

  notify(type + ' önértékelés sikeresen rögzítve (' + participantName + ')! Köszönjük!');
  renderDashboard();
}

function getExconEvaluatorsForEvent(eventId) {
  const names = new Set();
  const acc = getExerciseAccess(eventId);
  const evObj = eventId ? events.find(e => e.id === eventId) : null;

  // 1. Eseményre EXCON szerepkörben jelentkezett tagok
  if (evObj && Array.isArray(evObj.exconRegistrants)) {
    evObj.exconRegistrants.forEach(n => { if (n) names.add(n); });
  }

  // 2. Adminisztrátor által jóváhagyott belső EXCON értékelők
  Object.keys(acc.members || {}).forEach(k => {
    if (acc.members[k]?.status === 'approved_full') names.add(k);
  });

  // 3. Külsős PIN-es EXCON értékelők (aki nem csak megtekintő)
  (acc.externals || []).forEach(ext => {
    if (ext && ext.name && ext.access !== 'view') names.add(ext.name);
  });

  // 4. Központi EXCON jogosultsággal rendelkező csapattagok (ha nincs letiltva az eseményről)
  (members || []).forEach(m => {
    if (!m?.name) return;
    const isCentralExcon = Boolean(m.canAccessExcon) || (Array.isArray(m.grantedRoles) && m.grantedRoles.includes('excon'));
    const explicitlyRevoked = acc.members && acc.members[m.name]?.status === 'none';
    if (isCentralExcon && !explicitlyRevoked) {
      names.add(m.name);
    }
  });

  return Array.from(names);
}

function getDashboardMetrics(eventId, evaluatorFilter = selectedAnalysisEvaluator) {
  const allExcon = read('excon_evaluations', []);
  const allPart = read('participant_evaluations', []);
  const evExconAll = eventId ? allExcon.filter(x => !x.event_id || x.event_id === eventId) : allExcon;
  const evPart = eventId ? allPart.filter(x => !x.event_id || x.event_id === eventId) : allPart;

  // Először vegyük fel az összes EXCON tagot (akkor is, ha még 0 pontot töltött ki)
  const evaluatorMap = {};
  getExconEvaluatorsForEvent(eventId).forEach(name => {
    if (!evaluatorMap[name]) {
      evaluatorMap[name] = { name, count: 0, scoredCount: 0, totalScore: 0 };
    }
  });

  // Gyűjtsük ki és aggregáljuk a ténylegesen beküldött értékeléseket
  evExconAll.forEach(item => {
    const name = item.evaluator_name || 'Ismeretlen Értékelő';
    if (!evaluatorMap[name]) evaluatorMap[name] = { name, count: 0, scoredCount: 0, totalScore: 0 };
    evaluatorMap[name].count++;
    const sc = Number(item.score);
    if (sc >= 0) {
      evaluatorMap[name].scoredCount++;
      evaluatorMap[name].totalScore += sc;
    }
  });
  const evaluatorsList = Object.values(evaluatorMap).sort((a, b) => {
    if (b.count !== a.count) return b.count - a.count;
    return a.name.localeCompare(b.name, 'hu');
  });

  // Ha a kiválasztott értékelő nem szerepel az adott gyakorlatban, állítsuk vissza ALL-ra
  const activeFilter = (evaluatorFilter && evaluatorFilter !== 'ALL' && evaluatorMap[evaluatorFilter]) ? evaluatorFilter : 'ALL';
  const evExcon = activeFilter === 'ALL' ? evExconAll : evExconAll.filter(x => (x.evaluator_name || 'Ismeretlen Értékelő') === activeFilter);

  const count = evExcon.length;
  let totalScore = 0;
  let score0 = 0, score1 = 0, score2 = 0, scoreNA = 0;

  evExcon.forEach(item => {
    const sc = Number(item.score);
    if (sc === -1) {
      scoreNA++;
    } else {
      totalScore += sc;
      if (sc === 2) score2++;
      else if (sc === 1) score1++;
      else score0++;
    }
  });

  const scoredCount = score0 + score1 + score2;
  const maxScore = scoredCount * 2;
  const percent = maxScore > 0 ? Math.round((totalScore / maxScore) * 1000) / 10 : 0;

  // Categories (csak a 0, 1, 2 ponttal értékelt elemek számítanak bele a százalékos átlagba)
  const catDefs = {
    mgt1: { label: '1. Mobilizáció és Érkezés (1.1 - 1.6)', match: cp => /^1\./.test(cp), total: 0, count: 0, naCount: 0 },
    mgt2: { label: '2. Kárhelyszíni Koordináció (2.1 - 2.6)', match: cp => /^2\./.test(cp), total: 0, count: 0, naCount: 0 },
    mgt3: { label: '3. Műveleti Tervezés (3.1 - 3.6)', match: cp => /^3\./.test(cp), total: 0, count: 0, naCount: 0 },
    mgt4: { label: '4. Biztonság és Veszélyhelyzet (4.1 - 4.6)', match: cp => /^4\./.test(cp), total: 0, count: 0, naCount: 0 },
    mgt5: { label: '5. Demobilizáció (5.1 - 5.6)', match: cp => /^5\./.test(cp), total: 0, count: 0, naCount: 0 },
    opK9: { label: 'III/A. K9 Keresőkutya (OP-K9)', match: cp => /^OP-K9/i.test(cp), total: 0, count: 0, naCount: 0 },
    opCut: { label: 'III/B. Vágás / Cutting (OP-CUT)', match: cp => /^OP-CUT/i.test(cp), total: 0, count: 0, naCount: 0 },
    opBrk: { label: 'III/C. Törés / Breaching (OP-BRK)', match: cp => /^OP-BRK/i.test(cp), total: 0, count: 0, naCount: 0 },
    opRop: { label: 'III/D. Alpin / Rope rescue (OP-ROP)', match: cp => /^OP-ROP/i.test(cp), total: 0, count: 0, naCount: 0 },
    opShr: { label: 'III/E. Shoring / Dúcolás (OP-SHR)', match: cp => /^OP-SHR/i.test(cp), total: 0, count: 0, naCount: 0 },
  };

  evExcon.forEach(item => {
    const cp = item.checkpoint_code || '';
    const sc = Number(item.score);
    for (const k in catDefs) {
      if (catDefs[k].match(cp)) {
        if (sc === -1) {
          catDefs[k].naCount++;
        } else {
          catDefs[k].total += sc;
          catDefs[k].count++;
        }
      }
    }
  });

  const mgtTotal = catDefs.mgt1.total + catDefs.mgt2.total + catDefs.mgt3.total + catDefs.mgt4.total + catDefs.mgt5.total;
  const mgtCount = catDefs.mgt1.count + catDefs.mgt2.count + catDefs.mgt3.count + catDefs.mgt4.count + catDefs.mgt5.count;
  const mgtPct = mgtCount > 0 ? Math.round((mgtTotal / (mgtCount * 2)) * 1000) / 10 : 0;

  // Participant stats
  const t0List = evPart.filter(p => p.form_type === 'T0');
  const t1List = evPart.filter(p => p.form_type === 'T1');
  const totalPart = evPart.length;

  let avgLoad = 0;
  if (t1List.length > 0) {
    const sum = t1List.reduce((acc, p) => acc + (Number(p.responses?.felt_load) || 0), 0);
    avgLoad = Math.round((sum / t1List.length) * 10) / 10;
  } else if (t0List.length > 0) {
    const sum = t0List.reduce((acc, p) => acc + (Number(p.responses?.load) || 0), 0);
    avgLoad = Math.round((sum / t0List.length) * 10) / 10;
  }

  let avgPrep = 0;
  if (t0List.length > 0) {
    const sum = t0List.reduce((acc, p) => acc + (Number(p.responses?.prep) || 0), 0);
    avgPrep = Math.round((sum / t0List.length) * 10) / 10;
  }

  let avgRealism = 0;
  if (t1List.length > 0) {
    const sum = t1List.reduce((acc, p) => acc + (Number(p.responses?.realism) || 0), 0);
    avgRealism = Math.round((sum / t1List.length) * 10) / 10;
  }

  return {
    count,
    scoredCount,
    totalScore,
    maxScore,
    score0,
    score1,
    score2,
    scoreNA,
    percent,
    catDefs,
    mgtPct,
    mgtCount,
    totalPart,
    t0Count: t0List.length,
    t1Count: t1List.length,
    avgLoad,
    avgPrep,
    avgRealism,
    evaluatorsList,
    activeFilter,
    evExcon
  };
}

function renderRadarChartPanel(m) {
  const rows = Array.isArray(m.evExcon) ? m.evExcon : [];
  const defs = [
    { label: 'I. Mobilizáció', fn: c => c.startsWith('1.') },
    { label: 'II. Koordináció', fn: c => c.startsWith('2.') },
    { label: 'III. Tervezés', fn: c => c.startsWith('3.') },
    { label: 'IV. Biztonság', fn: c => c.startsWith('4.') },
    { label: 'V. Demob', fn: c => c.startsWith('5.') },
    { label: 'K9 Keresés', fn: c => c.startsWith('OP-K9') },
    { label: 'Vágás (Cut)', fn: c => c.startsWith('OP-CUT') },
    { label: 'Törés (Brk)', fn: c => c.startsWith('OP-BRK') },
    { label: 'Alpin (Rop)', fn: c => c.startsWith('OP-ROP') },
    { label: 'Dúcolás (Shr)', fn: c => c.startsWith('OP-SHR') }
  ];
  const stats = defs.map(d => {
    const vals = rows.filter(r => d.fn(r.checkpoint_code || '') && Number(r.score) >= 0).map(r => Number(r.score));
    const pct = vals.length ? Math.round((vals.reduce((a, b) => a + b, 0) / (vals.length * 2)) * 1000) / 10 : 0;
    return { label: d.label, pct, n: vals.length };
  });
  const hasAny = stats.some(s => s.n > 0);
  const titleFilter = m.activeFilter === 'ALL' ? 'Összesített' : esc(m.activeFilter);
  if (!hasAny) {
    return `<div class="panel" style="margin-bottom:18px;border-top:3px solid #38bdf8">
      <div class="panel-head"><div><h3>🕸️ INSARAG Képességprofil · Pókháló-diagram (${titleFilter})</h3><small style="color:var(--muted)">A 10 szakági terület egyensúlya</small></div></div>
      <div style="text-align:center;padding:24px;color:var(--muted);font-size:13px">Még nincs pontozott adat a pókháló-diagramhoz.</div>
    </div>`;
  }

  const cx = 165, cy = 148, R = 102, N = stats.length;
  const pt = (i, r) => {
    const a = (Math.PI * 2 * i) / N - Math.PI / 2;
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  };
  let rings = '';
  [25, 50, 75, 100].forEach(p => {
    const pts = stats.map((_, i) => pt(i, (p / 100) * R).map(v => v.toFixed(1)).join(',')).join(' ');
    rings += `<polygon points="${pts}" fill="none" stroke="rgba(148,163,184,0.22)" stroke-width="1"/>`;
  });
  let axes = '', labels = '';
  stats.forEach((s, i) => {
    const [x, y] = pt(i, R);
    const [lx, ly] = pt(i, R + 22);
    axes += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(148,163,184,0.22)"/>`;
    const anchor = lx < cx - 8 ? 'end' : lx > cx + 8 ? 'start' : 'middle';
    labels += `<text x="${lx.toFixed(1)}" y="${(ly + 3).toFixed(1)}" text-anchor="${anchor}" font-size="10.5" fill="#cbd5e1" font-weight="700">${esc(s.label)}</text>`;
  });
  const polyPts = stats.map((s, i) => pt(i, (s.pct / 100) * R).map(v => v.toFixed(1)).join(',')).join(' ');
  const dots = stats.map((s, i) => {
    const [x, y] = pt(i, (s.pct / 100) * R);
    const col = s.n === 0 ? '#64748b' : s.pct >= 80 ? '#10b981' : s.pct >= 70 ? '#f59e0b' : '#f43f5e';
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${col}" stroke="#0b162a" stroke-width="1.5"/>`;
  }).join('');

  const legendHtml = stats.map(s => {
    const col = s.n === 0 ? 'var(--muted)' : s.pct >= 80 ? '#34d399' : s.pct >= 70 ? '#fbbf24' : '#fb7185';
    const bar = s.n === 0 ? '#475569' : s.pct >= 80 ? '#10b981' : s.pct >= 70 ? '#f59e0b' : '#f43f5e';
    return `<div style="display:flex;align-items:center;gap:10px;font-size:12px">
      <span style="width:118px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600">${esc(s.label)}</span>
      <div style="flex:1;height:8px;border-radius:999px;background:rgba(255,255,255,0.08);overflow:hidden"><div style="width:${s.pct}%;height:100%;background:${bar};border-radius:999px"></div></div>
      <span style="width:46px;text-align:right;font-weight:800;color:${col}">${s.n ? s.pct + '%' : '–'}</span>
      <span style="width:42px;text-align:right;color:var(--muted);font-size:11px">${s.n} db</span>
    </div>`;
  }).join('');

  return `<div class="panel" style="margin-bottom:18px;border-top:3px solid #38bdf8">
    <div class="panel-head" style="margin-bottom:14px">
      <div>
        <h3>🕸️ INSARAG Képességprofil · Pókháló-diagram (${titleFilter})</h3>
        <small style="color:var(--muted)">A 10 műveleti és vezetési szakterület aránya egyetlen áttekinthető ábrán</small>
      </div>
      <span class="badge" style="background:rgba(56,189,248,0.16);color:#38bdf8">Radar Profil</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));gap:20px;align-items:center">
      <div style="display:flex;justify-content:center">
        <svg viewBox="0 0 330 296" style="width:100%;max-width:340px;height:auto;overflow:visible">
          ${rings}${axes}
          <polygon points="${polyPts}" fill="#38bdf8" fill-opacity="0.22" stroke="#38bdf8" stroke-width="2.2"/>
          ${dots}${labels}
        </svg>
      </div>
      <div style="display:grid;gap:8px">${legendHtml}</div>
    </div>
  </div>`;
}

function renderTop5Panel(m) {
  const rows = Array.isArray(m.evExcon) ? m.evExcon : [];
  const scored = rows.filter(r => Number(r.score) >= 0);
  const titleFilter = m.activeFilter === 'ALL' ? 'Összesített' : esc(m.activeFilter);
  if (!scored.length) return '';

  const cpTitles = {};
  getAllCheckpointItems().forEach(it => {
    const raw = it.label || it.text || it.title || '';
    const cleaned = raw.replace(new RegExp('^' + it.code.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*[·:\\-–]\\s*'), '').trim();
    cpTitles[it.code] = cleaned || raw;
  });

  const grouped = {};
  scored.forEach(r => {
    const code = r.checkpoint_code || '';
    if (!grouped[code]) grouped[code] = { cp: code, total: 0, n: 0, title: cpTitles[code] || '' };
    grouped[code].total += Number(r.score);
    grouped[code].n++;
  });
  const list = Object.values(grouped).map(g => ({
    ...g,
    pct: Math.round((g.total / (g.n * 2)) * 1000) / 10
  }));

  const minN = m.activeFilter === 'ALL' && list.filter(x => x.n >= 2).length >= 5 ? 2 : 1;
  const eligible = list.filter(x => x.n >= minN);
  const weakest = [...eligible].sort((a, b) => a.pct - b.pct || b.n - a.n).slice(0, 5);
  const strongest = [...eligible].sort((a, b) => b.pct - a.pct || b.n - a.n).slice(0, 5);

  const renderItem = (item, isWeak) => {
    const bar = isWeak ? (item.pct < 50 ? '#f43f5e' : '#f59e0b') : '#10b981';
    const col = isWeak ? (item.pct < 50 ? '#fb7185' : '#fbbf24') : '#34d399';
    return `<div style="background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px">
        <div style="min-width:0;flex:1">
          <span style="font-weight:900;font-size:13px;color:var(--ink)">${esc(item.cp)}</span>
          ${item.title ? `<span style="font-size:12px;color:#cbd5e1;margin-left:6px;font-weight:600">· ${esc(item.title)}</span>` : ''}
        </div>
        <div style="white-space:nowrap;flex-shrink:0">
          <b style="font-size:13px;color:${col}">${item.pct}%</b>
          <small style="color:var(--muted);margin-left:4px">(${item.n} fő)</small>
        </div>
      </div>
      <div style="height:7px;border-radius:999px;background:rgba(255,255,255,0.08);overflow:hidden">
        <div style="width:${item.pct}%;height:100%;background:${bar};border-radius:999px"></div>
      </div>
    </div>`;
  };

  return `<div class="panel" style="margin-bottom:18px">
    <div class="panel-head" style="margin-bottom:14px">
      <div>
        <h3>⚠️ Top 5 Fejlesztendő vs. 🏆 Top 5 Erősség (${titleFilter})</h3>
        <small style="color:var(--muted)">A legalacsonyabb és legmagasabb átlagú INSARAG ellenőrzőpontok rangsora</small>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(290px, 1fr));gap:16px">
      <div style="border-top:3px solid #f43f5e;padding-top:12px">
        <div style="font-size:12px;font-weight:800;color:#fb7185;text-transform:uppercase;letter-spacing:.7px;margin-bottom:10px">⚠️ Top 5 Kritikus / Fejlesztendő Pont</div>
        <div style="display:grid;gap:8px">${weakest.map(x => renderItem(x, true)).join('')}</div>
      </div>
      <div style="border-top:3px solid #10b981;padding-top:12px">
        <div style="font-size:12px;font-weight:800;color:#34d399;text-transform:uppercase;letter-spacing:.7px;margin-bottom:10px">🏆 Top 5 Kiemelkedő Erősség</div>
        <div style="display:grid;gap:8px">${strongest.map(x => renderItem(x, false)).join('')}</div>
      </div>
    </div>
  </div>`;
}

function renderPieChartSvg(m) {
  if (m.count === 0) {
    const allSaved = read('excon_evaluations', []);
    const otherEventIds = [...new Set(allSaved.map(x => x.event_id).filter(id => id && id !== selectedDashboardEventId))];
    const otherEventHtml = otherEventIds.length ? `<div style="margin-top:14px">${otherEventIds.map(id => {
      const evObj = events.find(e => e.id === id);
      const cnt = allSaved.filter(x => x.event_id === id).length;
      const evLabel = evObj ? evObj.title : 'Aktív gyakorlat';
      return `<button type="button" class="pill-btn" style="margin:4px;font-size:12px;padding:8px 16px" onclick="selectDashboardEvent('${esc(id)}')">📊 Ugrás ide: ${esc(evLabel)} (${cnt} db rögzített értékelés)</button>`;
    }).join('')}</div>` : '';
    const whoText = m.activeFilter === 'ALL'
      ? 'Még nincs rögzített értékelés a szerveren ehhez a gyakorlathoz'
      : `${esc(m.activeFilter)} még nem rögzített értékelést ehhez a gyakorlathoz`;
    return `<div style="text-align:center;padding:30px 10px;color:var(--muted)">
      <div style="font-size:36px;margin-bottom:8px">⭕</div>
      <div style="font-weight:700">${whoText}</div>
      <small>Amint bármelyik EXCON tag beküld egy pontot a webről vagy a mobilappból, itt azonnal kirajzolódik a kördiagram!</small>
      ${otherEventHtml}
    </div>`;
  }

  const p2 = (m.score2 / m.count) * 100;
  const p1 = (m.score1 / m.count) * 100;
  const p0 = (m.score0 / m.count) * 100;
  const pNA = (m.scoreNA / m.count) * 100;

  // SVG circular donut chart (radius = 70, circumference = 2 * PI * 70 = 439.82)
  const C = 439.82;
  const len2 = (p2 / 100) * C;
  const len1 = (p1 / 100) * C;
  const len0 = (p0 / 100) * C;
  const lenNA = (pNA / 100) * C;

  const offset2 = 0;
  const offset1 = -len2;
  const offset0 = -(len2 + len1);
  const offsetNA = -(len2 + len1 + len0);

  return `<div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:24px;padding:12px 0">
    <div style="position:relative;width:190px;height:190px">
      <svg width="190" height="190" viewBox="0 0 190 190" style="transform:rotate(-90deg)">
        <circle cx="95" cy="95" r="70" fill="transparent" stroke="#eeefe8" stroke-width="26" />
        ${m.score2 > 0 ? `<circle cx="95" cy="95" r="70" fill="transparent" stroke="#245c43" stroke-width="26" stroke-dasharray="${len2} ${C - len2}" stroke-dashoffset="${offset2}" />` : ''}
        ${m.score1 > 0 ? `<circle cx="95" cy="95" r="70" fill="transparent" stroke="#d97706" stroke-width="26" stroke-dasharray="${len1} ${C - len1}" stroke-dashoffset="${offset1}" />` : ''}
        ${m.score0 > 0 ? `<circle cx="95" cy="95" r="70" fill="transparent" stroke="#b3382c" stroke-width="26" stroke-dasharray="${len0} ${C - len0}" stroke-dashoffset="${offset0}" />` : ''}
        ${m.scoreNA > 0 ? `<circle cx="95" cy="95" r="70" fill="transparent" stroke="#94a3b8" stroke-width="26" stroke-dasharray="${lenNA} ${C - lenNA}" stroke-dashoffset="${offsetNA}" />` : ''}
      </svg>
      <div style="position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none">
        <span style="font-size:26px;font-weight:900;color:var(--ink)">${m.scoredCount > 0 ? m.percent + '%' : 'N/A'}</span>
        <small style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase">Megfelelés</small>
      </div>
    </div>
    <div style="display:grid;gap:8px;min-width:230px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--paper);padding:8px 12px;border-radius:8px;border-left:4px solid #245c43">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="width:12px;height:12px;border-radius:50%;background:#245c43;display:inline-block"></span>
          <span style="font-size:12px;font-weight:700">Kiváló (2 pont)</span>
        </div>
        <div><b>${m.score2} db</b> <small style="color:var(--muted)">(${Math.round(p2)}%)</small></div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--paper);padding:8px 12px;border-radius:8px;border-left:4px solid #d97706">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="width:12px;height:12px;border-radius:50%;background:#d97706;display:inline-block"></span>
          <span style="font-size:12px;font-weight:700">Részben (1 pont)</span>
        </div>
        <div><b>${m.score1} db</b> <small style="color:var(--muted)">(${Math.round(p1)}%)</small></div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--paper);padding:8px 12px;border-radius:8px;border-left:4px solid #b3382c">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="width:12px;height:12px;border-radius:50%;background:#b3382c;display:inline-block"></span>
          <span style="font-size:12px;font-weight:700">Nem megf. (0 pont)</span>
        </div>
        <div><b>${m.score0} db</b> <small style="color:var(--muted)">(${Math.round(p0)}%)</small></div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--paper);padding:8px 12px;border-radius:8px;border-left:4px solid #64748b">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="width:12px;height:12px;border-radius:50%;background:#94a3b8;display:inline-block"></span>
          <span style="font-size:12px;font-weight:700;color:#475569">Nem értékelem (-)</span>
        </div>
        <div><b>${m.scoreNA} db</b> <small style="color:var(--muted)">(${Math.round(pNA)}%)</small></div>
      </div>
      <div style="font-size:11px;color:var(--muted);text-align:right">Kitöltve: <b>${m.count}</b> pont · Pontozott: <b>${m.scoredCount}</b> (${m.totalScore}/${m.maxScore} pt)</div>
    </div>
  </div>`;
}

function renderBarItem(title, pct, count) {
  const color = pct >= 80 ? '#245c43' : pct >= 60 ? '#d97706' : '#b3382c';
  const valText = count > 0 ? (pct + '%') : 'Nincs pontozott adat';

  return `<div>
    <div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:13px">
      <b>${esc(title)} ${count > 0 ? `<small style="color:var(--muted);font-weight:400">(${count} pontozott mérés)</small>` : ''}</b>
      <strong style="color:${count > 0 ? color : 'var(--muted)'}">${valText}</strong>
    </div>
    <div style="background:#eeefe8;border-radius:6px;height:12px;overflow:hidden">
      <div style="background:${color};width:${barWidth}%;height:100%;transition:width .3s"></div>
    </div>
  </div>`;
}

function updateAnalysisView(type) {
  const c = document.getElementById('chartContainer');
  if (!c) return;
  const m = getDashboardMetrics(selectedDashboardEventId, selectedAnalysisEvaluator);

  if (type === 'management') {
    const c1 = m.catDefs.mgt1.count > 0 ? Math.round((m.catDefs.mgt1.total / (m.catDefs.mgt1.count * 2)) * 1000) / 10 : 0;
    const c2 = m.catDefs.mgt2.count > 0 ? Math.round((m.catDefs.mgt2.total / (m.catDefs.mgt2.count * 2)) * 1000) / 10 : 0;
    const c3 = m.catDefs.mgt3.count > 0 ? Math.round((m.catDefs.mgt3.total / (m.catDefs.mgt3.count * 2)) * 1000) / 10 : 0;
    const c4 = m.catDefs.mgt4.count > 0 ? Math.round((m.catDefs.mgt4.total / (m.catDefs.mgt4.count * 2)) * 1000) / 10 : 0;
    const c5 = m.catDefs.mgt5.count > 0 ? Math.round((m.catDefs.mgt5.total / (m.catDefs.mgt5.count * 2)) * 1000) / 10 : 0;
    c.innerHTML = `
      ${renderBarItem('1. Mobilizáció és Érkezés (1.1 - 1.6)', c1, m.catDefs.mgt1.count)}
      ${renderBarItem('2. Kárhelyszíni Koordináció (2.1 - 2.6)', c2, m.catDefs.mgt2.count)}
      ${renderBarItem('3. Műveleti Tervezés (3.1 - 3.6)', c3, m.catDefs.mgt3.count)}
      ${renderBarItem('4. Biztonság és Veszélyhelyzet (4.1 - 4.6)', c4, m.catDefs.mgt4.count)}
      ${renderBarItem('5. Demobilizáció (5.1 - 5.6)', c5, m.catDefs.mgt5.count)}
    `;
  } else if (type === 'operative') {
    const k9 = m.catDefs.opK9.count > 0 ? Math.round((m.catDefs.opK9.total / (m.catDefs.opK9.count * 2)) * 1000) / 10 : 0;
    const cut = m.catDefs.opCut.count > 0 ? Math.round((m.catDefs.opCut.total / (m.catDefs.opCut.count * 2)) * 1000) / 10 : 0;
    const brk = m.catDefs.opBrk.count > 0 ? Math.round((m.catDefs.opBrk.total / (m.catDefs.opBrk.count * 2)) * 1000) / 10 : 0;
    const rop = m.catDefs.opRop.count > 0 ? Math.round((m.catDefs.opRop.total / (m.catDefs.opRop.count * 2)) * 1000) / 10 : 0;
    const shr = m.catDefs.opShr.count > 0 ? Math.round((m.catDefs.opShr.total / (m.catDefs.opShr.count * 2)) * 1000) / 10 : 0;
    c.innerHTML = `
      ${renderBarItem('III/A. K9 Keresőkutyás kutatás', k9, m.catDefs.opK9.count)}
      ${renderBarItem('III/B. Vágás (Cutting)', cut, m.catDefs.opCut.count)}
      ${renderBarItem('III/C. Törés (Breaching)', brk, m.catDefs.opBrk.count)}
      ${renderBarItem('III/D. Alpin (Rope rescue)', rop, m.catDefs.opRop.count)}
      ${renderBarItem('III/E. Shoring (Dúcolás)', shr, m.catDefs.opShr.count)}
    `;
  } else if (type === 'stress') {
    const t0Score = m.t0Count > 0 ? m.avgPrep * 20 : 0;
    const t1RealScore = m.t1Count > 0 ? m.avgRealism * 20 : 0;
    c.innerHTML = `
      <div><div style="display:flex;justify-content:space-between;margin-bottom:4px"><b>T0 Szakmai Felkészültség (${m.t0Count} válasz)</b><strong style="color:var(--green)">${m.t0Count > 0 ? (m.avgPrep + ' / 5.0') : 'Nincs adat'}</strong></div><div style="background:#eeefe8;border-radius:6px;height:12px;overflow:hidden"><div style="background:var(--green);width:${t0Score}%;height:100%"></div></div></div>
      <div><div style="display:flex;justify-content:space-between;margin-bottom:4px"><b>Átlag Pszichofizikai Terhelés</b><strong style="color:#d97706">${m.avgLoad > 0 ? (m.avgLoad + ' / 10') : 'Nincs adat'}</strong></div><div style="background:#eeefe8;border-radius:6px;height:12px;overflow:hidden"><div style="background:#d97706;width:${m.avgLoad * 10}%;height:100%"></div></div></div>
      <div><div style="display:flex;justify-content:space-between;margin-bottom:4px"><b>Gyakorlat Realisztikussága (${m.t1Count} válasz)</b><strong style="color:var(--blue)">${m.t1Count > 0 ? (m.avgRealism + ' / 5.0') : 'Nincs adat'}</strong></div><div style="background:#eeefe8;border-radius:6px;height:12px;overflow:hidden"><div style="background:var(--blue);width:${t1RealScore}%;height:100%"></div></div></div>
    `;
  } else {
    // Kombinált nézet
    const k9 = m.catDefs.opK9.count > 0 ? Math.round((m.catDefs.opK9.total / (m.catDefs.opK9.count * 2)) * 1000) / 10 : 0;
    const cut = m.catDefs.opCut.count > 0 ? Math.round((m.catDefs.opCut.total / (m.catDefs.opCut.count * 2)) * 1000) / 10 : 0;
    const brk = m.catDefs.opBrk.count > 0 ? Math.round((m.catDefs.opBrk.total / (m.catDefs.opBrk.count * 2)) * 1000) / 10 : 0;
    const rop = m.catDefs.opRop.count > 0 ? Math.round((m.catDefs.opRop.total / (m.catDefs.opRop.count * 2)) * 1000) / 10 : 0;
    const shr = m.catDefs.opShr.count > 0 ? Math.round((m.catDefs.opShr.total / (m.catDefs.opShr.count * 2)) * 1000) / 10 : 0;
    c.innerHTML = `
      ${renderBarItem('Vezetés I-V. Fázisok (Mobilizáció, Koordináció, Tervezés, Biztonság, Demob)', m.mgtPct, m.mgtCount)}
      ${renderBarItem('III/A. K9 Keresőkutyás kutatás és irányítás', k9, m.catDefs.opK9.count)}
      ${renderBarItem('III/B. Vágás (Cutting / Fémdarabolás és szikravédelem)', cut, m.catDefs.opCut.count)}
      ${renderBarItem('III/C. Törés (Breaching / Tiszta áttörés és porvédelem)', brk, m.catDefs.opBrk.count)}
      ${renderBarItem('III/D. Alpin (Rope rescue / Kettős kötélbiztosítás és csigák)', rop, m.catDefs.opRop.count)}
      ${renderBarItem('III/E. Shoring (Dúcolás, teherelosztás és korai figyelmeztetés)', shr, m.catDefs.opShr.count)}
    `;
  }
}

function dashboardPage() {
  // KIZÁRÓLAG GYAKORLATOK SZŰRÉSE (és gyorsítótárazás a külsős PIN belépéshez):
  const rawExerciseEvents = events.filter(e => {
    const k = (e.kind || '').toLowerCase();
    const t = (e.title || '').toLowerCase();
    const et = (e.eventType || e.event_type || '').toLowerCase();
    // A Képzések (pl. Újonc gyakorlati képzés) SOHA ne jelenjenek meg az EXCON gyakorlatok között!
    if (k === 'képzések' || k === 'képzés' || et === 'training' || et === 'professional_training' || t.includes('képzés')) {
      return false;
    }
    return k === 'gyakorlatok' || k === 'gyakorlat' || et === 'exercise' || t.includes('gyakorlat') || t.includes('insarag');
  });

  if (rawExerciseEvents.length > 0) {
    save('cached_exercises', rawExerciseEvents);
  }
  const cachedExercises = read('cached_exercises', []);
  const extSession = getActiveExternalExcon();
  const mergedMap = new Map();
  [...rawExerciseEvents, ...cachedExercises].forEach(e => {
    if (e && e.id && !mergedMap.has(e.id)) mergedMap.set(e.id, e);
  });
  if (extSession && extSession.eventId && !mergedMap.has(extSession.eventId)) {
    mergedMap.set(extSession.eventId, {
      id: extSession.eventId,
      title: extSession.eventTitle || 'EXCON Gyakorlat',
      date: extSession.eventDate || new Date().toISOString().slice(0, 10),
      place: extSession.eventPlace || 'Kárhelyszín',

  const activeEventList = Array.from(mergedMap.values());

    const me = displayName();
