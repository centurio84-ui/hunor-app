    return `<div class="page-title"><div><div class="eyebrow">BEAVATKOZÓI ÉRTÉKELÉS</div><h1>T1 Űrlap (Művelet után)</h1><p>Megélt terhelés, kompetencia és tapasztalatok rögzítése a feladat lezárásakor.</p></div></div>
    ${tabsHtml}
    ${eventBanner}
    <div style="max-width:640px;margin:0 auto">
      <div class="panel" style="padding:24px">
        ${myT1 ? `<div style="margin-bottom:16px;padding:12px 14px;border-radius:10px;background:rgba(16,185,129,0.14);border:1px solid rgba(16,185,129,0.45);color:#6ee7b7;font-size:13px;font-weight:700">✓ A T1 űrlapodat már sikeresen leadtad (${esc(me)}). Ha szeretnéd, az alábbiakban módosíthatod.</div>` : ''}
        <form onsubmit="submitParticipantEvaluation('T1', event)">
          <div class="field" style="margin-bottom:18px">
            <label style="font-weight:700;display:block;margin-bottom:6px">RÉSZTVEVŐ NEVE (AUTOMATIKUS)</label>
            <input type="text" id="T1Token" readonly value="${esc(me)}" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-weight:800;opacity:0.9">
            <small style="color:var(--muted)">A rendszer automatikusan összepárosítja a T0 előzetes űrlapoddal.</small>
          </div>
          
          <div class="field" style="margin-bottom:18px">
            <label style="font-weight:700;display:block;margin-bottom:6px">1. Megélt fizikai és kognitív terhelés (1 - 10 skála): <span id="t1_load_val" style="color:#ef956c">${myT1?.responses?.felt_load || 8}</span> / 10</label>
            <input type="range" id="t1_felt_load" min="1" max="10" value="${myT1?.responses?.felt_load || 8}" oninput="document.getElementById('t1_load_val').textContent=this.value" style="width:100%">
          </div>

          <div class="field" style="margin-bottom:18px">
            <label style="font-weight:700;display:block;margin-bottom:6px">2. Mennyivel volt nehezebb a vártnál (1 - 5 skála): <span id="t1_corr_val" style="color:var(--green)">${myT1?.responses?.correction || 3}</span> / 5</label>
            <input type="range" id="t1_correction" min="1" max="5" value="${myT1?.responses?.correction || 3}" oninput="document.getElementById('t1_corr_val').textContent=this.value" style="width:100%">
          </div>

          <div class="field" style="margin-bottom:24px">
            <label style="font-weight:700;display:block;margin-bottom:6px">3. Gyakorlat realisztikussága (1 - 5 skála): <span id="t1_real_val" style="color:var(--green)">${myT1?.responses?.realism || 5}</span> / 5</label>
            <input type="range" id="t1_realism" min="1" max="5" value="${myT1?.responses?.realism || 5}" oninput="document.getElementById('t1_real_val').textContent=this.value" style="width:100%">
          </div>

          <button type="submit" id="T1SubmitBtn" class="pill-btn" style="width:100%;padding:16px;font-size:16px;font-weight:800">${myT1 ? 'T1 ŰRLAP FRISSÍTÉSE' : 'T1 ŰRLAP RÖGZÍTÉSE'}</button>
        </form>
      </div>
    </div>`;
  }

  // 5. DIAGRAM ÉS KOMPLEX ELEMZÉS FÜL (Csak kijelölt személyeknek, Adminnak vagy Külsős PIN-nel!)
  if (dashboardSubTab === 'analysis') {
    if (!canViewExerciseResults(selectedDashboardEventId)) {
      return `<div class="page-title"><div><div class="eyebrow">EXCON & T0/T1 ELEMZŐ KÖZPONT</div><h1>Gyakorlati Értékelő Műszerfal</h1><p>Zárt eredmények – csak az Adminisztrátor által kijelölt személyek számára.</p></div></div>
      ${tabsHtml}
      ${eventBanner}
      ${renderRestrictedExercisePanel(selectedDashboardEventId, 'view')}`;
    }
    const evaluatorDropdownHtml = `<div class="panel" style="margin-bottom:18px;padding:16px 20px;background:var(--paper);border:1px solid #355273;border-left:4px solid #74bbd8;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px">
      <div>
        <div style="font-size:11px;font-weight:800;text-transform:uppercase;color:#74bbd8;letter-spacing:.8px">👤 Értékelő szerinti szűrés (Személyre szabott diagramnézet)</div>
        <div style="font-size:13px;color:var(--muted);margin-top:2px">Válaszd ki a legördülő listából, hogy melyik értékelő pontszámait és diagramjait szeretnéd látni!</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <select onchange="setAnalysisEvaluator(this.value)" style="height:42px;padding:0 14px;border-radius:10px;border:1px solid #4d87a6;font-weight:800;font-size:13px;min-width:260px">
          <option value="ALL" ${metrics.activeFilter === 'ALL' ? 'selected' : ''}>📊 Összesített (Minden EXCON értékelő · ${metrics.evaluatorsList.length} fő)</option>
          ${metrics.evaluatorsList.map(ev => {
            const pct = ev.scoredCount > 0 ? Math.round((ev.totalScore / (ev.scoredCount * 2)) * 100) + '%' : 'N/A';
            return `<option value="${esc(ev.name)}" ${metrics.activeFilter === ev.name ? 'selected' : ''}>👤 ${esc(ev.name)} (${ev.count}/55 pont kitöltve · Átlag: ${pct})</option>`;
          }).join('')}
        </select>
        ${metrics.activeFilter !== 'ALL' ? `<button type="button" class="secondary" style="height:42px;font-size:12px;font-weight:700;padding:0 14px" onclick="setAnalysisEvaluator('ALL')">✕ Összes mutatása</button>` : ''}
        <button type="button" class="secondary" style="height:42px;font-size:12px;font-weight:700;padding:0 14px" onclick="refreshExconAnalysisNow()">🔄 Frissítés</button>
      </div>
    </div>`;

    return `<div class="page-title"><div><div class="eyebrow">EXCON & T0/T1 ELEMZŐ KÖZPONT</div><h1>Gyakorlati Értékelő Műszerfal</h1><p>Releváns, kitöltött adatok összesítése, értékelő szerinti szűrés, kördiagram és szakterületi arányok.</p></div><button class="pill-btn" onclick="setDashboardTab('conclusion')">Következtetések levonása ›</button></div>
    ${tabsHtml}
    ${eventBanner}
    ${evaluatorDropdownHtml}

    <!-- KPI kártyák dinamikus adatokkal -->
    <div class="panel" style="margin-bottom:18px">
      <div class="stats" style="margin:0">
        <div class="stat"><div class="stat-head"><span>KITÖLTÖTT PONTOK</span><span style="color:var(--green)">✓</span></div><b style="font-size:26px">${metrics.count} db</b><small style="color:var(--muted)">Pontozott: ${metrics.scoredCount} · Nem értékelt: ${metrics.scoreNA}</small></div>
        <div class="stat"><div class="stat-head"><span>ÁTLAGOS MEGFELELÉS</span><span style="color:var(--green)">★</span></div><b style="font-size:26px;color:#245c43">${metrics.scoredCount > 0 ? metrics.percent + '%' : '– %'}</b><small style="color:var(--muted)">${metrics.scoredCount > 0 ? (metrics.percent >= 80 ? 'Kiváló szint' : metrics.percent >= 60 ? 'Megfelelő' : 'Fejlesztendő') : 'Nincs pontozott adat'}</small></div>
        <div class="stat"><div class="stat-head"><span>KIVÁLASZTOTT NÉZET</span><span style="color:var(--blue)">👤</span></div><b style="font-size:18px">${metrics.activeFilter === 'ALL' ? `Összes (${metrics.evaluatorsList.length} fő)` : esc(metrics.activeFilter)}</b><small style="color:var(--muted)">${metrics.activeFilter === 'ALL' ? 'Csoportosított EXCON eredmény' : 'Egyéni értékelői adatlap'}</small></div>
        <div class="stat"><div class="stat-head"><span>ÁTLAG TERHELÉS (T0/T1)</span><span style="color:var(--orange)">⚡</span></div><b style="font-size:26px">${metrics.avgLoad > 0 ? metrics.avgLoad + ' / 10' : '– / 10'}</b><small style="color:var(--muted)">T0: ${metrics.t0Count} · T1: ${metrics.t1Count} válasz</small></div>
      </div>
    </div>

    <!-- TELJES ÉRTÉKELÉS KÖRDIAGRAMBAN (PIE / DONUT CHART) -->
    <div class="panel" style="margin-bottom:18px">
      <div class="panel-head">
        <div>
          <h3>Teljes Értékelés · Kördiagram (${metrics.activeFilter === 'ALL' ? 'Összes értékelő' : esc(metrics.activeFilter)})</h3>
          <small style="color:var(--muted)">INSARAG pontszámok megoszlása (2 pont, 1 pont, 0 pont és Nem értékelem)</small>
        </div>
        <span class="badge" style="background:#eeefe8;color:#245c43">${metrics.activeFilter === 'ALL' ? 'Összesített állapot' : 'Személyi értékelés'}</span>
      </div>
      ${renderPieChartSvg(metrics)}
    </div>

    <!-- PÓKHÁLÓ-DIAGRAM (RADAR CHART) -->
    ${renderRadarChartPanel(metrics)}

    <!-- TOP 5 KRITIKUS vs TOP 5 ERŐSSÉG -->
    ${renderTop5Panel(metrics)}

    <!-- Elemzési beállítások és szűrők -->
    <div class="panel" style="margin-bottom:18px">
      <div class="panel-head">
        <h3>Interaktív Elemző Diagramok & SzakterületiBontás (${metrics.activeFilter === 'ALL' ? 'Összesített' : esc(metrics.activeFilter)})</h3>
        <span class="badge" style="background:#eeefe8;color:#245c43">INSARAG Guidelines 2026</span>
      </div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;background:var(--bg);padding:12px;border-radius:10px">
        <label style="font-weight:700;font-size:12px;display:flex;align-items:center;gap:6px">
          Szakterületi bontás nézete:
          <select id="chartViewType" onchange="updateAnalysisView(this.value)" style="padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--paper)">
            <option value="combined">Kombinált (Vezetés + Operatív + T0/T1)</option>
            <option value="management">Csak Vezetési Fázisok (I - V)</option>
            <option value="operative">Csak Operatív Romkutatás (K9, Cut, Brk, Rop, Shr)</option>
            <option value="stress">Pszichofizikai Terhelés és Realitás (T0 vs T1)</option>
          </select>
        </label>
      </div>

      <!-- Vizuális Oszlop- és Sávdiagramok dinamikus értékekkel -->
      <div id="chartContainer" style="display:grid;gap:14px">
        ${renderBarItem('Vezetés I-V. Fázisok (Mobilizáció, Koordináció, Tervezés, Biztonság, Demob)', metrics.mgtPct, metrics.mgtCount)}
        ${renderBarItem('III/A. K9 Keresőkutyás kutatás és irányítás', metrics.catDefs.opK9.count > 0 ? Math.round((metrics.catDefs.opK9.total / (metrics.catDefs.opK9.count * 2)) * 1000) / 10 : 0, metrics.catDefs.opK9.count)}
        ${renderBarItem('III/B. Vágás (Cutting / Fémdarabolás és szikravédelem)', metrics.catDefs.opCut.count > 0 ? Math.round((metrics.catDefs.opCut.total / (metrics.catDefs.opCut.count * 2)) * 1000) / 10 : 0, metrics.catDefs.opCut.count)}
        ${renderBarItem('III/C. Törés (Breaching / Tiszta áttörés és porvédelem)', metrics.catDefs.opBrk.count > 0 ? Math.round((metrics.catDefs.opBrk.total / (metrics.catDefs.opBrk.count * 2)) * 1000) / 10 : 0, metrics.catDefs.opBrk.count)}
        ${renderBarItem('III/D. Alpin (Rope rescue / Kettős kötélbiztosítás és csigák)', metrics.catDefs.opRop.count > 0 ? Math.round((metrics.catDefs.opRop.total / (metrics.catDefs.opRop.count * 2)) * 1000) / 10 : 0, metrics.catDefs.opRop.count)}
        ${renderBarItem('III/E. Shoring (Dúcolás, teherelosztás és korai figyelmeztetés)', metrics.catDefs.opShr.count > 0 ? Math.round((metrics.catDefs.opShr.total / (metrics.catDefs.opShr.count * 2)) * 1000) / 10 : 0, metrics.catDefs.opShr.count)}
      </div>
    </div>

    <!-- Admin felügyeleti és zöld/piros ellenőrzőpont áttekintő panel az Elemzés fülön is -->
    <div class="panel" style="margin-bottom:18px">
      ${renderCompletedCheckpointsManager(selectedDashboardEventId)}
    </div>

    <!-- Résztvevők (nem EXCON) T0 vs T1 Diagramok & Admin Kitöltöttségi Áttekintő -->
    ${renderParticipantAnalysisPanel(selectedDashboardEventId)}`;
  }

  // 6. KÖVETKEZTETÉSEK LEVONÁSA ÉS ZÁRÓ ÉRTÉKELÉS FÜL
  if (dashboardSubTab === 'conclusion') {
    if (!canViewExerciseResults(selectedDashboardEventId)) {
      return `<div class="page-title"><div><div class="eyebrow">ZÁRÓ ÉRTÉKELÉS ÉS ELEMZÉS</div><h1>Következtetések és Javaslatok</h1><p>Zárt zárójelentés – csak kijelölt személyek számára.</p></div></div>
      ${tabsHtml}
      ${eventBanner}
      ${renderRestrictedExercisePanel(selectedDashboardEventId, 'view')}`;
    }
    return `<div class="page-title"><div><div class="eyebrow">ZÁRÓ ÉRTÉKELÉS ÉS ELEMZÉS</div><h1>Következtetések és Javaslatok</h1><p>Szakmai zárójelentés az EXCON és T0/T1 eredmények alapján.</p></div></div>
    ${tabsHtml}
    ${eventBanner}
    <div style="max-width:760px;margin:0 auto">
      <div class="panel" style="padding:24px">
        <div class="panel-head">
          <h3>Vezetői Értékelés és Szakmai Következtetés</h3>
          ${savedConcl ? '<span class="badge" style="background:#e5f4ec;color:#245c43">✓ Mentett jelentés (' + esc(savedConcl.date) + ')</span>' : ''}
        </div>
        <form onsubmit="submitEventConclusion(event)">
          <div class="field" style="margin-bottom:16px">
            <label style="font-weight:700;display:block;margin-bottom:6px">FŐBB ERŐSSÉGEK (POSITIVE FINDINGS)</label>
            <textarea id="conclStrengths" rows="3" placeholder="Pl. Kiemelkedő K9 felderítési pontosság, fegyelmezett biztonsági tiszti felügyelet, gyors BoO felépítés..." style="width:100%;padding:12px;border:1px solid var(--line);border-radius:10px">${savedConcl ? esc(savedConcl.strengths || '') : ''}</textarea>
          </div>

          <div class="field" style="margin-bottom:16px">
            <label style="font-weight:700;display:block;margin-bottom:6px">FEJLESZTENDŐ TERÜLETEK / HIÁNYOSSÁGOK (AREAS FOR IMPROVEMENT)</label>
            <textarea id="conclImprovements" rows="3" placeholder="Pl. Breaching során hatékonyabb porgátlás szükséges, vágókorong logisztikai készlet növelése..." style="width:100%;padding:12px;border:1px solid var(--line);border-radius:10px">${savedConcl ? esc(savedConcl.improvements || '') : ''}</textarea>
          </div>

          <div class="field" style="margin-bottom:20px">
            <label style="font-weight:700;display:block;margin-bottom:6px">ZÁRÓ SZAKMAI KÖVETKEZTETÉS ÉS AKCIÓTERV</label>
            <textarea id="conclText" rows="4" required placeholder="A csapat a nemzetközi INSARAG Heavy elvárásoknak megfelelt. A feltárt korrekciók beépítendők a következő havi tréningtervbe..." style="width:100%;padding:12px;border:1px solid var(--line);border-radius:10px">${savedConcl ? esc(savedConcl.conclusion || '') : ''}</textarea>
          </div>

          <button type="submit" class="pill-btn" style="width:100%;padding:16px;font-size:16px;font-weight:900;background:var(--green)">KÖVETKEZTETÉSEK MENTÉSE ÉS JELENTÉS ZÁRÁSA</button>
        </form>
      </div>

      <!-- VISSZAJELZÉSEK: KÉPEK, WORD, PDF CSATOLMÁNYOK -->
      ${(() => {
        const atts = getConclusionAttachments(selectedDashboardEventId);
        const fmtSize = b => b >= 1024 * 1024 ? (b / (1024 * 1024)).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
        const iconFor = (name, type) => {
          const n = (name || '').toLowerCase();
          if ((type || '').startsWith('image/') || /\.(png|jpe?g|webp|gif|heic)$/.test(n)) return '🖼️';
          if (n.endsWith('.pdf') || (type || '').includes('pdf')) return '📄';
          if (/\.(docx?|odt|rtf)$/.test(n) || (type || '').includes('word')) return '📝';
          return '📎';
        };
        return `<div class="panel" style="padding:24px;margin-top:20px;border-top:3px solid #74bbd8">
          <div class="panel-head" style="margin-bottom:14px">
            <div>
              <div class="eyebrow" style="color:#74bbd8;letter-spacing:1px">📎 VISSZAJELZÉSEK & DOKUMENTUMOK</div>
              <h3 style="margin:4px 0 2px">Csatolt Visszajelzések (Kép, Word, PDF)</h3>
              <small style="color:var(--muted)">Tölts fel fotókat, Word dokumentumokat (.doc, .docx) vagy PDF fájlokat a gyakorlat záró visszajelzéseihez (max. 25 MB/fájl).</small>
            </div>
            <span class="badge" style="background:rgba(116,187,216,0.16);color:#74bbd8">${atts.length} db fájl</span>
          </div>

          <form onsubmit="uploadConclusionAttachments(event)" style="background:var(--bg);border:1px dashed #3b5271;border-radius:12px;padding:16px;margin-bottom:18px">
            <div style="display:grid;gap:12px">
              <div>
                <label style="font-weight:700;font-size:12px;display:block;margin-bottom:6px">FÁJLOK KIVÁLASZTÁSA (KÉP, WORD, PDF · TÖBB IS KIJELÖLHETŐ)</label>
                <input type="file" id="conclFileInput" multiple accept="image/*,.pdf,.doc,.docx,.odt,.xls,.xlsx,.ppt,.pptx,.txt" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font-size:13px">
              </div>
              <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
                <input type="text" id="conclFileNote" placeholder="Rövid megjegyzés a visszajelzéshez (pl. K9 szektor értékelés, helyszíni fotók)..." style="flex:1;min-width:220px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px">
                <button type="submit" id="conclUploadBtn" class="pill-btn" style="padding:10px 18px;font-size:13px;font-weight:800;white-space:nowrap">📤 Fájlok feltöltése</button>
              </div>
              <div id="conclUploadStatus" style="display:none;font-size:12px;color:#74bbd8;font-weight:700"></div>
            </div>
          </form>

          ${atts.length === 0 ? `
            <div style="padding:18px;background:var(--bg);border-radius:10px;text-align:center;color:var(--muted);font-size:13px">
              Még nincs feltöltött visszajelzés fájl ehhez a gyakorlathoz.
            </div>` : `
            <div style="display:grid;gap:10px">
              ${atts.map(att => `<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;flex-wrap:wrap">
                <div style="display:flex;align-items:center;gap:12px;min-width:0;flex:1">
                  <span style="font-size:24px;flex-shrink:0">${iconFor(att.name, att.type)}</span>
                  <div style="min-width:0">
                    <b style="font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(att.name)}</b>
                    <small style="color:var(--muted);font-size:11px;display:block">${fmtSize(att.size || 0)} · Feltöltötte: ${esc(att.uploaded_by || 'Tag')} · ${att.uploaded_at ? new Date(att.uploaded_at).toLocaleString('hu-HU') : ''}</small>
                    ${att.note ? `<div style="font-size:12px;color:#93c5fd;margin-top:3px">„${esc(att.note)}”</div>` : ''}
                  </div>
                </div>
                <div style="display:flex;gap:8px;flex-shrink:0">
                  <button type="button" class="secondary" style="font-size:12px;font-weight:700;padding:7px 12px;border-color:#74bbd8;color:#c2e9f5" onclick="openConclusionAttachment('${esc(att.id)}')">👁️ Megnyitás / Letöltés</button>
                  ${(isAdmin || att.uploaded_by === displayName()) ? `<button type="button" class="secondary" style="font-size:12px;padding:7px 10px;border-color:#ef4444;color:#fca5a5" onclick="deleteConclusionAttachment('${esc(att.id)}')" title="Törlés">🗑️</button>` : ''}
                </div>
              </div>`).join('')}
            </div>`}
        </div>`;
      })()}
    </div>`;
  }

  return '';
}


function evaluationsPage(){
  return `<div class="page-title"><div><div class="eyebrow">BEAVATKOZÓI ÁLLAPOTFELMÉRÉS</div><h1>T0 / T1 Önértékelő Űrlapok</h1><p>Gyakorlat előtti és utáni anonim állapotfelmérés a Google Forms kiváltására.</p></div><button class="pill-btn" onclick="setPage('dashboard')">‹ Műszerfal</button></div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px">
    <div class="panel"><div class="panel-head"><div style="display:flex;align-items:center;gap:10px"><span style="width:36px;height:36px;border-radius:10px;background:#e2ecf5;color:#2c5b88;display:grid;place-items:center;font-weight:900">T0</span><div><h3>Művelet előtti felmérés</h3><small style="color:var(--muted)">Felkészültség, csapatkohézió és várt terhelés</small></div></div></div><p style="margin:14px 0;color:#6b7369;font-size:13px">Kérjük, hogy a művelet megkezdése előtt töltsd ki az anonim T0 kérdőívet!</p><a href="/t0" class="pill-btn" style="display:inline-block;text-align:center;text-decoration:none;width:100%">T0 Űrlap kitöltése</a></div>
    <div class="panel"><div class="panel-head"><div style="display:flex;align-items:center;gap:10px"><span style="width:36px;height:36px;border-radius:10px;background:#e5f4ec;color:#245c43;display:grid;place-items:center;font-weight:900">T1</span><div><h3>Művelet utáni értékelés</h3><small style="color:var(--muted)">Megélt terhelés, kompetencia és realisztikusság</small></div></div></div><p style="margin:14px 0;color:#6b7369;font-size:13px">A feladat befejezése után azonosító tokeneddel küldd be a T1 utólagos tapasztalatokat!</p><a href="/t1" class="pill-btn" style="display:inline-block;text-align:center;text-decoration:none;width:100%">T1 Űrlap kitöltése</a></div>

function hcMonth(){const y=month.getFullYear(),m=month.getMonth(),offset=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate(),rows=Math.ceil((offset+days)/7),today=hcKey(new Date()),items=hcEvents();let cells='';for(let i=0;i<rows*7;i++){const d=new Date(y,m,1-offset+i),key=hcKey(d),matches=items.filter(e=>hcOn(e,key));cells+=`<div class="hc-day ${d.getMonth()!==m?'hc-outside':''} ${key===today?'hc-today':''}"><button class="hc-day-number" onclick="hcShowDay('${key}')" aria-label="${esc(d.toLocaleDateString('hu-HU',{year:'numeric',month:'long',day:'numeric'}))}${key===today?', ma':''}">${d.getDate()===1?esc(d.toLocaleDateString('hu-HU',{month:'short'}))+' ':''}${d.getDate()}</button><div class="hc-day-events">${matches.slice(0,3).map(hcEventButton).join('')}${matches.length>3?`<button class="hc-more" onclick="hcShowDay('${key}')">+${matches.length-3} további</button>`:''}</div></div>`}return `<div class="hc-month-grid" style="--hc-rows:${rows}">${['HÉTFŐ','KEDD','SZERDA','CSÜTÖRTÖK','PÉNTEK','SZOMBAT','VASÁRNAP'].map(n=>`<div class="hc-weekday">${n}</div>`).join('')}${cells}</div>`}
function hcAgenda(){const from=hunorCalendarDay||hcKey(new Date(month.getFullYear(),month.getMonth(),1)),to=hunorCalendarDay||hcKey(new Date(month.getFullYear(),month.getMonth()+1,0)),items=hcEvents().filter(e=>(e.date||e.startDate||'')<=to&&(e.endDate||e.date||e.startDate||'')>=from);return `<div class="hc-agenda">${hunorCalendarDay?`<div class="hc-day-heading"><h3>${esc(new Date(hunorCalendarDay+'T12:00:00').toLocaleDateString('hu-HU',{weekday:'long',month:'long',day:'numeric'}))}</h3><button class="secondary" onclick="hcSetView('month')">Vissza a hónaphoz</button></div>`:''}${items.length?items.map(e=>{const d=new Date((e.date||e.startDate)+'T12:00:00');return `<article class="hc-agenda-row"><div class="hc-agenda-date"><strong>${d.getDate()}</strong><span>${esc(d.toLocaleDateString('hu-HU',{month:'short',weekday:'short'}))}</span></div><div class="hc-agenda-time">${esc(e.time||'Nincs időpont')}${e.endDate&&e.endDate!==(e.date||e.startDate)?`<small>${esc((e.date||e.startDate)+' – '+e.endDate)}</small>`:''}</div><div class="hc-agenda-info">${hcEventButton(e)}<p>${esc(e.place||'Helyszín nincs megadva')} · ${esc(e.kind||'Egyéb')}</p></div></article>`}).join(''):'<div class="hc-empty"><span>▦</span><h3>Nincs esemény ebben az időszakban</h3><p>Válassz másik hónapot, vagy módosítsd a keresést és a szűrőket.</p></div>'}</div>`}
function hcMini(){const y=month.getFullYear(),m=month.getMonth(),offset=(new Date(y,m,1).getDay()+6)%7,today=hcKey(new Date());let cells='';for(let i=0;i<42;i++){const d=new Date(y,m,i-offset+1),key=hcKey(d);cells+=`<button class="${d.getMonth()!==m?'hc-mini-outside':''} ${key===today?'hc-mini-today':''} ${key===hunorCalendarDay?'hc-mini-selected':''}" onclick="hcShowDay('${key}')" aria-label="${esc(d.toLocaleDateString('hu-HU'))}">${d.getDate()}</button>`}return `<div class="hc-mini-title"><b>${esc(month.toLocaleDateString('hu-HU',{year:'numeric',month:'long'}))}</b><div><button onclick="hcMove(-1)" aria-label="Előző hónap">‹</button><button onclick="hcMove(1)" aria-label="Következő hónap">›</button></div></div><div class="hc-mini-grid">${['H','K','Sze','Cs','P','Szo','V'].map(n=>`<span>${n}</span>`).join('')}${cells}</div>`}
calendarPage=function(){return `<section class="hc-calendar"><div class="hc-toolbar"><div class="hc-calendar-title"><span class="hc-calendar-icon" aria-hidden="true">▦</span><h1>Naptár</h1></div><button class="secondary hc-today-button" onclick="hcToday()">Ma</button><div class="hc-period-nav"><button onclick="hcMove(-1)" aria-label="Előző hónap">‹</button><button onclick="hcMove(1)" aria-label="Következő hónap">›</button></div><h2>${esc(month.toLocaleDateString('hu-HU',{year:'numeric',month:'long'}))}</h2><label class="hc-view-label"><span class="sr-only">Naptárnézet</span><select aria-label="Naptárnézet" onchange="hcSetView(this.value)"><option value="month" ${hunorCalendarView==='month'?'selected':''}>Hónap</option><option value="agenda" ${hunorCalendarView==='agenda'?'selected':''}>Ütemezés</option></select></label></div><div class="hc-layout"><aside class="hc-calendar-sidebar">${canCreateEvent()?'<button class="pill-btn hc-create" onclick="openEvent()"><span>＋</span> Létrehozás</button>':''}<div class="hc-mini">${hcMini()}</div><label class="hc-search"><span>Keresés az események között</span><input type="search" value="${esc(hunorCalendarSearch)}" placeholder="Cím, helyszín…" oninput="hcSearch(this.value)"></label><fieldset class="hc-filters"><legend>Eseménytípusok</legend>${hunorCalendarKinds.map((k,i)=>`<label class="${calendarEventClass({kind:k})}"><input type="checkbox" ${hunorCalendarHidden.has(k)?'':'checked'} onchange="hcFilter(${i},this.checked)"><span>${esc(k)}</span></label>`).join('')}</fieldset><p class="hc-sidebar-note">A színek az eseménytípusokat jelölik. Kattints egy eseményre a részletekhez.</p></aside><div class="hc-main"><div class="hc-result-note" id="hcResultNote">${hcSummary()}</div><div id="hcViewContent">${hunorCalendarView==='month'?hcMonth():hcAgenda()}</div></div></div></section>`};
function hcSummary(){return hunorCalendarSearch||hunorCalendarHidden.size?`Szűrt nézet${hunorCalendarSearch?' · '+esc(hunorCalendarSearch):''} <button onclick="hcClearFilters()">Szűrők törlése</button>`:'A csapat közös eseményei · hétfői hétkezdés'}
function hcRefresh(){if(page!=='calendar')return;const el=document.querySelector('#hcViewContent');if(el)el.innerHTML=hunorCalendarView==='month'?hcMonth():hcAgenda();const note=document.querySelector('#hcResultNote');if(note)note.innerHTML=hcSummary()}
function hcSearch(value){hunorCalendarSearch=value;hcRefresh()}
function hcFilter(i,enabled){const k=hunorCalendarKinds[i];enabled?hunorCalendarHidden.delete(k):hunorCalendarHidden.add(k);hcRefresh()}
function hcClearFilters(){hunorCalendarHidden.clear();hunorCalendarSearch='';content.innerHTML=calendarPage()}
function hcMove(direction){month=new Date(month.getFullYear(),month.getMonth()+direction,1);hunorCalendarDay=null;content.innerHTML=calendarPage()}
function hcToday(){month=new Date();hunorCalendarDay=null;content.innerHTML=calendarPage()}
function hcSetView(view){hunorCalendarView=view==='agenda'?'agenda':'month';hunorCalendarDay=null;content.innerHTML=calendarPage()}
function hcShowDay(key){hunorCalendarDay=key;month=new Date(key+'T12:00:00');hunorCalendarView='agenda';content.innerHTML=calendarPage()}

function calendarEventClass(event){return ({'Képzések':'calendar-training','Gyakorlatok':'calendar-exercise','Bemutatók':'calendar-demonstration','Riasztási események':'calendar-alert','Egyéb':'calendar-other'})[event.kind]||'calendar-other'}
function calendarPage(){const year=month.getFullYear(),monthIndex=month.getMonth(),first=new Date(year,monthIndex,1),offset=(first.getDay()+6)%7,days=new Date(year,monthIndex+1,0).getDate(),previousDays=new Date(year,monthIndex,0).getDate();let cells='';for(let i=0;i<42;i++){const n=i-offset+1,dim=n<1||n>days,day=dim?(n<1?previousDays+n:n-days):n,dateMonth=dim?(n<1?new Date(year,monthIndex-1,1):new Date(year,monthIndex+1,1)):month,dateKey=`${dateMonth.getFullYear()}-${String(dateMonth.getMonth()+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`,items=events.filter(event=>{const start=event.date||event.startDate||'',end=event.endDate||start;return start&&dateKey>=start&&dateKey<=end});cells+=`<div class="day ${dim?'dim':''}"><div class="daynum">${day}</div>${items.map(event=>`<div class="day-event ${calendarEventClass(event)}" data-event-id="${esc(event.id||'')}" title="${esc(event.title)} · ${esc(event.kind)}" role="button" tabindex="0" onclick="openEventDetails('${esc(event.id||'')}')" onkeydown="if(event.key==='Enter'||event.key===' '){openEventDetails('${esc(event.id||'')}')}">${esc(event.title)}</div>`).join('')}</div>`}const legend=[['Képzések','calendar-training'],['Gyakorlatok','calendar-exercise'],['Bemutatók','calendar-demonstration'],['Riasztási események','calendar-alert'],['Egyéb','calendar-other']];return `<div class="page-title"><div><div class="eyebrow">TERVEZZÜNK EGYÜTT</div><h1>Közös naptár</h1><p>Egy helyen a csapat eseményei, kezdő- és befejező dátum szerint.</p></div><button class="pill-btn" onclick="openAlertEvent()">＋ Riasztási esemény</button></div><div class="panel calendar-panel"><div class="panel-head"><div class="month-nav"><button onclick="moveMonth(-1)">‹</button><b>${month.toLocaleDateString('hu-HU',{year:'numeric',month:'long'})}</b><button onclick="moveMonth(1)">›</button></div><div class="calendar-legend">${legend.map(([label,cls])=>`<span class="legend-item ${cls}">${label}</span>`).join('')}</div></div><div class="calendar">${['H','K','Sze','Cs','P','Szo','V'].map(label=>`<div class="weekday">${label}</div>`).join('')}${cells}</div></div>`}
