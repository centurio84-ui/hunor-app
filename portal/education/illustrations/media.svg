<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Matyi és András – Képek és videók helye: képi helyőrző</title><desc id="desc">Nem karakterábrázolás. A jóváhagyott referenciaképre várunk.</desc><rect width="960" height="480" rx="24" fill="#111b34"/><rect x="24" y="24" width="912" height="432" rx="18" fill="#1c2541" stroke="#68728d" stroke-dasharray="9 8"/><g font-family="Arial,sans-serif"><text x="56" y="77" fill="#ffb703" font-size="19" font-weight="bold">MINTA · ILLUSZTRÁCIÓ HELYE · 05</text><text x="56" y="133" fill="white" font-size="30" font-weight="bold">Képek és videók helye</text><rect x="56" y="176" width="400" height="120" rx="16" fill="#512939" stroke="#e8858b"/><text x="80" y="222" fill="white" font-size="27" font-weight="bold">Matyi</text><text x="80" y="261" fill="#f5ced1" font-size="20">Piros tűzoltó-védőruha</text><rect x="480" y="176" width="424" height="120" rx="16" fill="#243858" stroke="#8ea9cf"/><text x="504" y="222" fill="white" font-size="27" font-weight="bold">András</text><text x="504" y="261" fill="#d4e1f5" font-size="20">Sötétkék tűzoltó-védőruha</text><text x="56" y="354" fill="#c8d0e0" font-size="21">A két szereplő témaspecifikus képe ide kerül.</text><text x="56" y="396" fill="#99a8c1" font-size="18">Az elfogadott karakterterv érkezésére várunk.</text></g></svg>