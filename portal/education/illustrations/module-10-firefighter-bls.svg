<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="t d"><title id="t">Tűzoltó BLS – hiányzó illusztráció</title><desc id="d">Matyi és András témaspecifikus képe még nem áll rendelkezésre. Nem használunk másik modulból átvett ábrát.</desc><rect width="960" height="480" rx="24" fill="#1c2541"/><rect x="24" y="24" width="912" height="432" rx="16" fill="none" stroke="#ffb703" stroke-dasharray="9 9"/><g font-family="Arial,sans-serif"><text x="55" y="95" fill="#ffb703" font-size="20">10. MODUL · KÉPI HELYŐRZŐ</text><text x="55" y="165" fill="white" font-size="40" font-weight="bold">Tűzoltó BLS</text><text x="55" y="235" fill="#cdd5e5" font-size="24">Matyi és András külön illusztrációja még hiányzik.</text><text x="55" y="295" fill="#cdd5e5" font-size="21">Másik modul képét nem használjuk helyette.</text><text x="55" y="370" fill="#e5c395" font-size="20">Demonstráció · szakmai jóváhagyás szükséges.</text></g></svg>