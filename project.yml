name: HUNOR
options:
  bundleIdPrefix: hu.hunor
  deploymentTarget:
    iOS: "17.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: "2.0.0"
targets:
  HUNOR:
    type: application
    platform: iOS
    sources:
      - path: HUNORApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hu.hunor.app
        INFOPLIST_KEY_CFBundleDisplayName: HUNOR
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        SWIFT_VERSION: "5.0"
    dependencies:
      - package: Supabase
        product: Supabase
